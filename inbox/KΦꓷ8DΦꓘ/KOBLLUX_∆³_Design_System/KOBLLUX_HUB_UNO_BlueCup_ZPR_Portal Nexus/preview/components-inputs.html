<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
  <div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.2em;color:var(--muted);margin-bottom:4px">PROVEDOR</div>
    <div style="width:100%;background:#0b0b12;border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--fg);font-family:var(--font-mono);font-size:var(--fs-d4);display:flex;justify-content:space-between;align-items:center">
      <span>Anthropic (Claude)</span>
      <span style="color:var(--muted);font-size:var(--fs-d2)">▾</span>
    </div>
  </div>
  <div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.2em;color:var(--muted);margin-bottom:4px">CHAVE API · <span style="color:#ffd700">Anthropic</span></div>
    <div style="display:flex;gap:8px">
      <div style="flex:1;background:#0b0b12;border:1px solid #ffd700;border-radius:6px;padding:7px 12px;color:var(--fg);font-family:var(--font-mono);font-size:var(--fs-d4);letter-spacing:.1em">sk-ant-●●●●●●●●●●●●●●●●●●●●●●●●xJ4f</div>
      <button style="background:#2a2a3a;border:none;border-radius:6px;padding:6px 10px;color:#fff;font-size:var(--fs-d3);cursor:pointer">👁</button>
      <button style="background:rgba(255,215,0,0.15);border:1px solid #ffd700;border-radius:6px;padding:6px 14px;color:#ffd700;font-family:var(--font-mono);font-size:var(--fs-d3);cursor:pointer">✧ Salvar</button>
    </div>
  </div>
</div></body></html>
