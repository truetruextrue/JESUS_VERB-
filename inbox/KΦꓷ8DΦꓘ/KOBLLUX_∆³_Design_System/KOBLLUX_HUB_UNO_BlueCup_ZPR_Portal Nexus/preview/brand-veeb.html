<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">

<div style="background:#0b0b12;border:1px solid #00e5ff33;border-left:3px solid #00e5ff;border-radius:var(--r-input);padding:10px 12px">
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:#00e5ff;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px">V · Vibração</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d7);color:var(--fg);font-weight:700">432 Hz</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);margin-top:4px">f = 432 + 7.83·sin(θ)</div>
</div>
<div style="background:#0b0b12;border:1px solid #f0c06033;border-left:3px solid #f0c060;border-radius:var(--r-input);padding:10px 12px">
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:#f0c060;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px">E · Energia</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d7);color:var(--fg);font-weight:700">18 mód.</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);margin-top:4px">E = ∫₀ᵀ Φ(t)·ω(t)dt</div>
</div>
<div style="background:#0b0b12;border:1px solid #8b5cf633;border-left:3px solid #8b5cf6;border-radius:var(--r-input);padding:10px 12px">
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:#8b5cf6;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px">E · Estrutura</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d7);color:var(--fg);font-weight:700">χ = 2</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);margin-top:4px">χ = V−E+F</div>
</div>
<div style="background:#0b0b12;border:1px solid #39ff5a33;border-left:3px solid #39ff5a;border-radius:var(--r-input);padding:10px 12px">
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:#39ff5a;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px">B · Base</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d7);color:var(--fg);font-weight:700">S = 167</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);margin-top:4px">S = Σ bᵢ × 2^(i-1)</div>
</div>
</div></body></html>
