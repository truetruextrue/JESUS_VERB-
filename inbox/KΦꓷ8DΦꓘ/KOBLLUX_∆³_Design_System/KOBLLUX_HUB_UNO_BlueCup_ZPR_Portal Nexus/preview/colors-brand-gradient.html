<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.col { display:flex; flex-direction:column; gap:8px; }
.swatch { width:100%; height:42px; border-radius:var(--r-panel); border:1px solid var(--border-strong); position:relative; overflow:hidden; }
.swatch .ring { position:absolute; inset:0; border-radius:inherit; box-shadow:var(--shadow-inset); pointer-events:none; }
.cell { display:flex; flex-direction:column; gap:4px; min-width:0; }
.cell .name { font-family:var(--font-mono); font-size:var(--fs-d2); letter-spacing:.12em; color:var(--fg); text-transform:uppercase; white-space:nowrap; }
.cell .hex  { font-family:var(--font-mono); font-size:var(--fs-d1); color:var(--muted); letter-spacing:.1em; }
.cell .meta { font-family:var(--font-mono); font-size:var(--fs-d1); color:var(--muted); }
</style></head><body>
<div style="display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;align-items:stretch">
  <div style="height:96px;border-radius:var(--r-section);background:linear-gradient(135deg,#ff52e5 0%,#00c5e5 100%);position:relative">
    <div style="position:absolute;inset:0;border-radius:inherit;box-shadow:var(--shadow-inset)"></div>
    <div style="position:absolute;left:14px;bottom:10px;font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.2em;color:#000;text-transform:uppercase;font-weight:700">brand · pink → cyan</div>
  </div>
  <div class="cell">
    <div class="swatch" style="background:#ff52e5;height:96px"><div class="ring"></div></div>
    <div class="name" style="color:#ff52e5">--grad-a</div>
    <div class="hex">#FF52E5</div>
    <div class="meta">0x0B RESSONAR</div>
  </div>
  <div class="cell">
    <div class="swatch" style="background:#00c5e5;height:96px"><div class="ring"></div></div>
    <div class="name" style="color:#00c5e5">--grad-b</div>
    <div class="hex">#00C5E5</div>
    <div class="meta">hub cyan</div>
  </div>
</div></body></html>
