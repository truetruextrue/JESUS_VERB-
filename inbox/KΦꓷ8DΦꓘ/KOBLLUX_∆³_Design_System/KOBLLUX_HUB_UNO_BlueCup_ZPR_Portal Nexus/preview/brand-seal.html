<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:10px 4px">

  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="font-family:var(--font-mono);font-size:var(--fs-d8);color:var(--fg);font-weight:700;letter-spacing:.05em">KOBLLUX ∆³</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d4);color:#ffd700;letter-spacing:.15em">VERDADE × INTEGRAR ÷ Δ = ∞</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d3);color:var(--muted);letter-spacing:.1em">3 × 6 × 9 × 7 = 1134  ·  α = 1/137</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:6px">∆⁷ · §∞§≈Ω</div>
  </div>
</div></body></html>
