<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(13,1fr);gap:6px">

<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid #b978ff33;border-radius:var(--r-panel);background:#0b0b12">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:#b978ff;letter-spacing:.1em">0x00</span>
  <span style="font-family:var(--font-mono);font-size:28px;color:#b978ff;line-height:1;text-shadow:0 0 12px #b978ff66">○</span>
  <span style="font-family:var(--font-mono);font-size:7px;letter-spacing:.18em;color:#b978ff;text-transform:uppercase;text-align:center">INICIAR</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid #67e6ff33;border-radius:var(--r-panel);background:#0b0b12">

  <span style="font-family:var(--font-mono);font-size:7px;letter-spacing:.18em;color:#7cffb2;text-transform:uppercase;text-align:center">INTEGRAR</span>

<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid #f2c94c33;border-radius:var(--r-panel);background:#0b0b12">

  <span style="font-family:var(--font-mono);font-size:28px;color:#f2c94c;line-height:1;text-shadow:0 0 12px #f2c94c66">♾</span>
