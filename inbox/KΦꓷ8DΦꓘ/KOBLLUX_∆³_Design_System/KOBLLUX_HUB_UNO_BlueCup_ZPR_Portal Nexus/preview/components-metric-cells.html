<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden">

<div style="background:#0a0a12;padding:10px 12px;display:flex;flex-direction:column;gap:3px">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.15em;color:var(--muted);text-transform:uppercase">Coef. K</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d7);font-weight:700;color:#50b4ff;line-height:1">82</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);margin-top:2px">Tempo</span>
</div>
<div style="background:#0a0a12;padding:10px 12px;display:flex;flex-direction:column;gap:3px">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.15em;color:var(--muted);text-transform:uppercase">Coef. B</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d7);font-weight:700;color:#3ab6ff;line-height:1">74</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);margin-top:2px">Espaço</span>
</div>
<div style="background:#0a0a12;padding:10px 12px;display:flex;flex-direction:column;gap:3px">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.15em;color:var(--muted);text-transform:uppercase">Δ Conv.</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d7);font-weight:700;color:#ffd700;line-height:1">78%</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);margin-top:2px">K×B / Δ</span>
</div>
<div style="background:#0a0a12;padding:10px 12px;display:flex;flex-direction:column;gap:3px">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.15em;color:var(--muted);text-transform:uppercase">α × β</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d7);font-weight:700;color:#67e6ff;line-height:1">0.91</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);margin-top:2px">Simetria</span>
</div>
<div style="background:#0a0a12;padding:10px 12px;display:flex;flex-direction:column;gap:3px">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.15em;color:var(--muted);text-transform:uppercase">12_K×B_12</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d7);font-weight:700;color:#ff52e5;line-height:1">7.28</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);margin-top:2px">Selada</span>
</div>
<div style="background:#0a0a12;padding:10px 12px;display:flex;flex-direction:column;gap:3px">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.15em;color:var(--muted);text-transform:uppercase">Estado</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d7);font-weight:700;color:#ffd700;line-height:1">CONV.</span>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);margin-top:2px">Sistema</span>
</div>
</div></body></html>
