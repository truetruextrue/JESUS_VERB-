<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button style="background:#5d7cff;border:none;border-radius:var(--r-panel);padding:8px 14px;color:#fff;font-weight:600;font-size:var(--fs-d5);cursor:pointer">⚙️ Modularizar</button>
    <button style="background:#2a2a3a;border:none;border-radius:var(--r-panel);padding:8px 14px;color:#fff;font-size:var(--fs-d5);cursor:pointer">📋 Colar</button>
    <button style="background:transparent;border:1px dashed #222;border-radius:var(--r-panel);padding:7px 12px;color:#9aa0b4;font-size:var(--fs-d3);cursor:pointer">⚙ API Config</button>
  </div>
  <button style="width:100%;padding:11px;background:transparent;border:1px solid #ffd700;border-radius:6px;font-size:var(--fs-d5);letter-spacing:.25em;color:#ffd700;cursor:pointer;font-family:var(--font-mono);box-shadow:0 0 4px rgba(255,215,0,0.15)">⧉ · 0X05 · CONVERGIR · CALCULAR Δ</button>
</div></body></html>
