<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="position:relative;height:140px;border-radius:var(--r-section);overflow:hidden;background:radial-gradient(circle at 25% 40%, #ff52e5 0%, transparent 55%), radial-gradient(circle at 75% 60%, #00c5e5 0%, transparent 55%), #0b0b0f">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;height:100%">
    <div style="background:rgba(18,18,18,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:var(--r-card);padding:10px;display:flex;flex-direction:column;justify-content:flex-end">
      <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--fg);letter-spacing:.12em">--blur-pill</div>
      <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.18em">20px</div>
    </div>
    <div style="background:rgba(15,17,32,0.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:var(--r-card);padding:10px;display:flex;flex-direction:column;justify-content:flex-end">
      <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--fg);letter-spacing:.12em">--blur-panel</div>
      <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.18em">24px</div>
    </div>
    <div style="background:rgba(18,18,18,0.65);backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);border:1px solid rgba(255,255,255,0.12);border-radius:var(--r-card);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05)">
      <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--fg);letter-spacing:.12em">--blur-glass</div>
      <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.18em">50px</div>
    </div>
  </div>
</div></body></html>
