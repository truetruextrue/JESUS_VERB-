<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">

<div style="background:#0b0b12;border:1px solid #67e6ff33;border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column">
  <div style="position:relative;height:100px;background:radial-gradient(circle at center,#67e6ff33 0%,#000 70%);display:flex;align-items:center;justify-content:center;overflow:hidden">
    <img src="../assets/archetypes/nova.gif" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid #67e6ff55;box-shadow:0 0 24px #67e6ff55">
    <span style="position:absolute;top:8px;right:10px;font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.18em;color:#67e6ff">0x01 · 432Hz</span>
  </div>
  <div style="padding:10px 12px;display:flex;flex-direction:column;gap:3px">
    <div style="font-family:var(--font-mono);font-size:var(--fs-d5);color:#67e6ff;font-weight:700;letter-spacing:.05em">Nova</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.18em;color:var(--muted);text-transform:uppercase">Inspira · PULSAR</div>
    <div style="font-family:var(--font-sans);font-size:var(--fs-d4);color:var(--fg);line-height:1.5">semente, sopro inicial</div>
  </div>
</div>
<div style="background:#0b0b12;border:1px solid #ff7a0033;border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column">
  <div style="position:relative;height:100px;background:radial-gradient(circle at center,#ff7a0033 0%,#000 70%);display:flex;align-items:center;justify-content:center;overflow:hidden">
    <video src="../assets/archetypes/infodose.mp4" autoplay loop muted playsinline style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid #ff7a0055;box-shadow:0 0 24px #ff7a0055"></video>
    <span style="position:absolute;top:8px;right:10px;font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.18em;color:#ff7a00">0x05 · 672Hz</span>
  </div>
  <div style="padding:10px 12px;display:flex;flex-direction:column;gap:3px">
    <div style="font-family:var(--font-mono);font-size:var(--fs-d5);color:#ff7a00;font-weight:700;letter-spacing:.05em">Infodose</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.18em;color:var(--muted);text-transform:uppercase">Verbo · CONVERGIR</div>
    <div style="font-family:var(--font-sans);font-size:var(--fs-d4);color:var(--fg);line-height:1.5">tradução da intenção</div>
  </div>
</div>
<div style="background:#0b0b12;border:1px solid #b978ff33;border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column">
  <div style="position:relative;height:100px;background:radial-gradient(circle at center,#b978ff33 0%,#000 70%);display:flex;align-items:center;justify-content:center;overflow:hidden">
    <div style="width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#b978ff66 0%,transparent 70%);display:flex;align-items:center;justify-content:center;border:1px solid #b978ff55;box-shadow:0 0 24px #b978ff55"><span style="font-family:var(--font-mono);font-size:36px;color:#b978ff">△</span></div>
    <span style="position:absolute;top:8px;right:10px;font-family:var(--font-mono);font-size:var(--fs-d1);letter-spacing:.18em;color:#b978ff">0x00 · 396Hz</span>
  </div>
  <div style="padding:10px 12px;display:flex;flex-direction:column;gap:3px">
    <div style="font-family:var(--font-mono);font-size:var(--fs-d5);color:#b978ff;font-weight:700;letter-spacing:.05em">Atlas</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.18em;color:var(--muted);text-transform:uppercase">Planejador · INICIAR</div>
    <div style="font-family:var(--font-sans);font-size:var(--fs-d4);color:var(--fg);line-height:1.5">ordem, estrutura, mapa</div>
  </div>
</div>
</div></body></html>
