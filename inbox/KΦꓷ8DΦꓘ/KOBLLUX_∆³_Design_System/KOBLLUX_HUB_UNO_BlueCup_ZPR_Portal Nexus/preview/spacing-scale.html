<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">

<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;align-items:center">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d3);color:var(--fg);letter-spacing:.1em">--sp-1</span>
  <div style="display:flex;align-items:center;gap:8px">
    <div style="height:18px;background:var(--cor-0x05);width:calc(0.40em * var(--fs-base) * 1.6);border-radius:3px"></div>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted)">0.40em</span>
  </div>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);letter-spacing:.12em">4px gap · between chips</span>
</div>
<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;align-items:center">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d3);color:var(--fg);letter-spacing:.1em">--sp-2</span>
  <div style="display:flex;align-items:center;gap:8px">
    <div style="height:18px;background:var(--cor-0x05);width:calc(0.75em * var(--fs-base) * 1.6);border-radius:3px"></div>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted)">0.75em</span>
  </div>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);letter-spacing:.12em">8px gap · default</span>
</div>
<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;align-items:center">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d3);color:var(--fg);letter-spacing:.1em">--sp-3</span>
  <div style="display:flex;align-items:center;gap:8px">
    <div style="height:18px;background:var(--cor-0x05);width:calc(1.20em * var(--fs-base) * 1.6);border-radius:3px"></div>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted)">1.20em</span>
  </div>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);letter-spacing:.12em">12–14px section padding</span>
</div>
<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;align-items:center">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d3);color:var(--fg);letter-spacing:.1em">--sp-4</span>
  <div style="display:flex;align-items:center;gap:8px">
    <div style="height:18px;background:var(--cor-0x05);width:calc(2.00em * var(--fs-base) * 1.6);border-radius:3px"></div>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted)">2.00em</span>
  </div>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);letter-spacing:.12em">24px hero spacing</span>
</div>
<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;align-items:center">
  <span style="font-family:var(--font-mono);font-size:var(--fs-d3);color:var(--fg);letter-spacing:.1em">--sp-5</span>
  <div style="display:flex;align-items:center;gap:8px">
    <div style="height:18px;background:var(--cor-0x05);width:calc(3.00em * var(--fs-base) * 1.6);border-radius:3px"></div>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted)">3.00em</span>
  </div>
  <span style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted);letter-spacing:.12em">36px deck cushion</span>
</div>
</div></body></html>
