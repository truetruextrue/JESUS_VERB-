<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

<div style="background:#0a0a12;border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;display:flex;flex-direction:column">
  <div style="padding:7px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02)">
    <div style="width:7px;height:7px;border-radius:50%;background:#50b4ff;box-shadow:0 0 6px #50b4ff"></div>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d3);letter-spacing:.2em;color:#50b4ff;text-transform:uppercase">K · Kodux · Tempo</span>
    <span style="margin-left:auto;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted)">Python ▾</span>
  </div>
  <pre style="margin:0;padding:9px 10px;font-family:var(--font-mono);font-size:var(--fs-d4);color:var(--fg);line-height:1.7;white-space:pre-wrap"># polo K · estrutura · tempo
for archetype in arquetipos:
    process(archetype)
    seal(opcode=0x07)</pre>
  <div style="padding:4px 10px;border-top:1px solid var(--border);display:flex;font-family:var(--font-mono);font-size:var(--fs-d1);color:rgba(255,255,255,0.25)">
    <span style="color:#50b4ff">⌂ POLO K · x=K=α</span>
    <span style="margin-left:auto">102</span>
  </div>
</div>
<div style="background:#0a0a12;border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;display:flex;flex-direction:column">
  <div style="padding:7px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02)">
    <div style="width:7px;height:7px;border-radius:50%;background:#3ab6ff;box-shadow:0 0 6px #3ab6ff"></div>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d3);letter-spacing:.2em;color:#3ab6ff;text-transform:uppercase">B · Bllue · Espaço</span>
    <span style="margin-left:auto;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--muted)">HTML ▾</span>
  </div>
  <pre style="margin:0;padding:9px 10px;font-family:var(--font-mono);font-size:var(--fs-d4);color:var(--fg);line-height:1.7;white-space:pre-wrap"><!-- polo B · interface · espaço -->
<div class="v-glass">
  <span class="opcode-label">⧉ 0x05</span>
</div></pre>
  <div style="padding:4px 10px;border-top:1px solid var(--border);display:flex;font-family:var(--font-mono);font-size:var(--fs-d1);color:rgba(255,255,255,0.25)">
    <span style="color:#3ab6ff">⌂ POLO B · y=B=β</span>
    <span style="margin-left:auto">108</span>
  </div>
</div>
</div></body></html>
