<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end">

<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:100%;height:54px;background:var(--panel);border:1px solid var(--cor-0x07);border-radius:5px"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--cor-0x07);letter-spacing:.1em">5px</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.15em;text-transform:uppercase">chip</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:100%;height:54px;background:var(--panel);border:1px solid var(--cor-0x07);border-radius:6px"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--cor-0x07);letter-spacing:.1em">6px</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.15em;text-transform:uppercase">input</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:100%;height:54px;background:var(--panel);border:1px solid var(--cor-0x07);border-radius:8px"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--cor-0x07);letter-spacing:.1em">8px</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.15em;text-transform:uppercase">panel</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:100%;height:54px;background:var(--panel);border:1px solid var(--cor-0x07);border-radius:10px"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--cor-0x07);letter-spacing:.1em">10px</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.15em;text-transform:uppercase">section</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:100%;height:54px;background:var(--panel);border:1px solid var(--cor-0x07);border-radius:12px"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--cor-0x07);letter-spacing:.1em">12px</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.15em;text-transform:uppercase">card</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:100%;height:54px;background:var(--panel);border:1px solid var(--cor-0x07);border-radius:24px"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--cor-0x07);letter-spacing:.1em">24px</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.15em;text-transform:uppercase">glass</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:100%;height:54px;background:var(--panel);border:1px solid var(--cor-0x07);border-radius:99px"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--cor-0x07);letter-spacing:.1em">99px</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.15em;text-transform:uppercase">pill</div>
</div>
</div></body></html>
