<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.col { display:flex; flex-direction:column; gap:8px; }
.swatch { width:100%; height:42px; border-radius:var(--r-panel); border:1px solid var(--border-strong); position:relative; overflow:hidden; }
.swatch .ring { position:absolute; inset:0; border-radius:inherit; box-shadow:var(--shadow-inset); pointer-events:none; }
.cell { display:flex; flex-direction:column; gap:4px; min-width:0; }
.cell .name { font-family:var(--font-mono); font-size:var(--fs-d2); letter-spacing:.12em; color:var(--fg); text-transform:uppercase; white-space:nowrap; }
.cell .hex  { font-family:var(--font-mono); font-size:var(--fs-d1); color:var(--muted); letter-spacing:.1em; }
.cell .meta { font-family:var(--font-mono); font-size:var(--fs-d1); color:var(--muted); }
</style></head><body>
<div class="row" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">

<div class="cell">
  <div class="swatch" style="background:#eaeaf0"><div class="ring"></div></div>
  <div class="name">--fg</div>
  <div class="hex">#eaeaf0</div>
  <div class="meta">primary text</div>
</div>
<div class="cell">
  <div class="swatch" style="background:#f5f7ff"><div class="ring"></div></div>
  <div class="name">--fg-strong</div>
  <div class="hex">#f5f7ff</div>
  <div class="meta">strong text</div>
</div>
<div class="cell">
  <div class="swatch" style="background:#9aa0b4"><div class="ring"></div></div>
  <div class="name">--muted</div>
  <div class="hex">#9aa0b4</div>
  <div class="meta">muted label</div>
</div>
<div class="cell">
  <div class="swatch" style="background:#5d7cff"><div class="ring"></div></div>
  <div class="name">--accent</div>
  <div class="hex">#5d7cff</div>
  <div class="meta">accent / link</div>
</div>
<div class="cell">
  <div class="swatch" style="background:#38bdf8"><div class="ring"></div></div>
  <div class="name">--accent-active</div>
  <div class="hex">#38bdf8</div>
  <div class="meta">active state</div>
</div>
</div></body></html>
