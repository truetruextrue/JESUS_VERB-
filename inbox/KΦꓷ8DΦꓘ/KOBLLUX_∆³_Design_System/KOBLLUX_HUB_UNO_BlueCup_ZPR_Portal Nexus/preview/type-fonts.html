<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r-section);padding:14px 16px">
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:8px">--font-sans · SYSTEM</div>
    <div style="font-family:var(--font-sans);font-size:var(--fs-d7);color:var(--fg);font-weight:600;margin-bottom:4px">VERDADE · INTEGRAR ÷ Δ</div>
    <div style="font-family:var(--font-sans);font-size:var(--fs-d5);color:var(--fg);margin-bottom:4px">A linguagem é economia comprimida.</div>
    <div style="font-family:var(--font-sans);font-size:var(--fs-d4);color:var(--muted)">system-ui · -apple-system · Segoe UI · Roboto</div>
  </div>
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r-section);padding:14px 16px">
    <div style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:8px">--font-mono · OPCODE</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d7);color:var(--cor-0x07);font-weight:700;margin-bottom:4px">0x07 · SELAR · 777Hz</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d5);color:var(--fg);margin-bottom:4px">S = Σ bᵢ × 2^(i-1)</div>
    <div style="font-family:var(--font-mono);font-size:var(--fs-d4);color:var(--muted);letter-spacing:.1em">SF Mono · Cascadia · Roboto Mono · Menlo</div>
  </div>
</div></body></html>
