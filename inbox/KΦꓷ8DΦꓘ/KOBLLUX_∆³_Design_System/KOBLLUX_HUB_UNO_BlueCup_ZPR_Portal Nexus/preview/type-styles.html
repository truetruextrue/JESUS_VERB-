<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:baseline;gap:18px">
    <span style="font-family:var(--font-mono);font-size:var(--fs-d2);letter-spacing:.2em;color:var(--muted);text-transform:uppercase">LABEL · UPPERCASE LETTER-SPACED</span>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted-3)">.label / .label-uc</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:18px">
    <span class="opcode-label" style="color:var(--cor-0x07)">0X07 · SELAR · ✧ · 777HZ</span>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted-3)">.opcode-label · D1</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:18px">
    <span style="font-family:var(--font-mono);font-size:var(--fs-d8);color:var(--cor-0x07);font-weight:700;line-height:1">1134</span>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted-3)">.value-hero · D8</span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:8px 12px;background:#0a0a14;border:1px solid var(--border);border-radius:var(--r-panel)">
    <span style="font-family:var(--font-mono);font-size:var(--fs-d3);letter-spacing:.12em;color:var(--cor-0x07)">VERDADE × INTEGRAR ÷ Δ = ∞</span>
    <span style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted-3);margin-left:auto">.eq · equation bar</span>
  </div>
</div></body></html>
