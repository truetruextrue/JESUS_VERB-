<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">

<button style="padding:8px 18px;border-radius:var(--r-pill);background:rgba(103,230,255,0.12);backdrop-filter:blur(20px);border:1px solid #67e6ff;color:#67e6ff;font-family:var(--font-mono);font-size:var(--fs-d3);font-weight:600;letter-spacing:.08em;cursor:pointer">◈ ANTES</button>

<button style="padding:8px 18px;border-radius:var(--r-pill);background:transparent;backdrop-filter:blur(20px);border:1px solid rgba(255,215,0,0.3);color:rgba(255,215,0,0.6);font-family:var(--font-mono);font-size:var(--fs-d3);font-weight:600;letter-spacing:.08em;cursor:pointer">Δ ANÁLISE</button>

<button style="padding:8px 18px;border-radius:var(--r-pill);background:transparent;backdrop-filter:blur(20px);border:1px solid #222;color:#9aa0b4;font-family:var(--font-mono);font-size:var(--fs-d3);font-weight:600;letter-spacing:.08em;cursor:pointer">◎ DEPOIS</button>

<button style="padding:8px 18px;border-radius:var(--r-pill);background:rgba(255,215,0,0.15);backdrop-filter:blur(20px);border:1px solid #ffd700;color:#ffd700;font-family:var(--font-mono);font-size:var(--fs-d3);font-weight:600;letter-spacing:.08em;cursor:pointer">✧ Carregar</button>

<button style="padding:8px 18px;border-radius:var(--r-pill);background:rgba(168,255,120,0.08);backdrop-filter:blur(20px);border:1px solid rgba(168,255,120,0.3);color:#a8ff78;font-family:var(--font-mono);font-size:var(--fs-d3);font-weight:600;letter-spacing:.08em;cursor:pointer">🦀 Rust Local</button>

</div></body></html>
