<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background:var(--bg); color:var(--fg); padding:18px 22px; font-family:var(--font-sans); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-top:6px">

<div style="display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px">
  <div style="width:100%;height:70px;background:#0f0f18;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05)"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--fg);letter-spacing:.12em;text-align:center">--shadow-inset</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.18em;text-align:center;text-transform:uppercase">inset highlight</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px">
  <div style="width:100%;height:70px;background:#0f0f18;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 14px 40px rgba(0,0,0,0.45)"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--fg);letter-spacing:.12em;text-align:center">--shadow-card</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.18em;text-align:center;text-transform:uppercase">elevated card</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px">
  <div style="width:100%;height:70px;background:rgba(18,18,18,0.65);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 20px 50px rgba(0,0,0,0.5)"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--fg);letter-spacing:.12em;text-align:center">--shadow-glass</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.18em;text-align:center;text-transform:uppercase">hero glass</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px">
  <div style="width:100%;height:70px;background:#0f0f18;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 0 30px rgba(255,215,0,0.9)"></div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d2);color:var(--fg);letter-spacing:.12em;text-align:center">--shadow-seal</div>
  <div style="font-family:var(--font-mono);font-size:var(--fs-d1);color:var(--muted);letter-spacing:.18em;text-align:center;text-transform:uppercase">✧ Δ⁷ halo</div>
</div>
</div></body></html>
