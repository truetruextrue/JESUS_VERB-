<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>KOBLLUX · SymbolBar · v2 · Carousel + Chromorfismo</title>
   <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Scripts externos -->
  <script defer src="config/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>



   <style>
      /* ═══════════════════════════════════════════════════════════════════
   KOBLLUX · SYMBOLBAR · v2
   Carousel + Chromorfismo Cobre Fino + Iframe Background + Matrix Densa
   ═══════════════════════════════════════════════════════════════════ */

      /* ── MATRIX DENSA TOKENS ── */
:root {
         --void: #02020a;
         --abyss: #060615;
         --deep: #0a0a20;
         --ink: #0f0f2e;

         /* COBRE FINO – paleta primária/secundária escamada */
         --cu-0: #8B4513;
         /* cobre escuro / base */
         --cu-1: #B87333;
         /* cobre puro */
         --cu-2: #CD853F;
         /* cobre médio */
         --cu-3: #D4943A;
         /* cobre quente */
         --cu-4: #E8A855;
         /* cobre claro */
         --cu-5: #F0C060;
         /* ouro-cobre */
         --cu-6: #C9A84C;
         /* ouro matrix */
         --cu-7: #FFD700;
         /* ouro brilhante */

         /* Voz reativa – arquétipo atual */
         --kob-voice-primary: #C9A84C;
         --kob-voice-secondary: #8B4513;
         --kob-voice-accent: #F0C060;
         --arch-color: #C9A84C;
         --arch-glow: rgba(201,168,76,0.35);
         --arch-glow-strong: rgba(201,168,76,0.6);

         --border: color-mix(in srgb, var(--kob-voice-primary) 35%, rgba(255,255,255,0.08));
         --panel-bg: color-mix(in srgb, var(--kob-voice-primary) 8%, #0b0f18);
         --kob-voice-bg-soft: color-mix(in srgb, var(--kob-voice-primary) 18%, transparent);

         --pearl: #e8e0f0;
         --mist: rgba(232,224,240,0.65);
         --cyan: #00e5ff;

         --mono: 'Share Tech Mono', monospace;
         --display: 'Cinzel Decorative', serif;
         --body: 'Rajdhani', sans-serif;

         --orb-speed: 7.2s;

         /* z-layers */
         --z-bg: 0;
         --z-content: 100;
         --z-hud: 5000;
         --z-overlay: 8000;
         --z-system: 9999;
      }

      /* ── RESET ── */
      *, *::before, *::after {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }
      html, body {
         height: 100%;
         overflow: hidden;
         font-family: var(--body);
         background: var(--void);
         color: var(--pearl);
         -webkit-tap-highlight-color: transparent;
         user-select: none;
      }

      /* ── FUNDO CÓSMICO ── */
      body::before {
         content: '';
         position: fixed;
         inset: 0;
         z-index: 0;
         pointer-events: none;
         background:
         radial-gradient(ellipse at 15% 40%, color-mix(in srgb, var(--kob-voice-primary) 10%, transparent) 0%, transparent 55%),
         radial-gradient(ellipse at 85% 60%, color-mix(in srgb, var(--kob-voice-secondary) 8%, transparent) 0%, transparent 55%),
         radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 65%);
         transition: background 0.8s ease;
         
      }
      /* Grain overlay */
      body::after {
         content: '';
         position: fixed;
         inset: 0;
         z-index: 1;
         pointer-events: none;
         opacity: 0.3;
         background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      }

      /* ═══════════════════════════════════════════════════════════════════
   LAYOUT PRINCIPAL – WRAP + IFRAME VIEWER
   ═══════════════════════════════════════════════════════════════════ */
      #root {
         position: fixed;
         inset: 0;
         display: flex;
         align-items: center;
         justify-content: center;
         z-index: var(--z-content);
      }
      
      
      #particles-js {
        position: absolute;
        inset: 0;
        z-index: 0;
        }

      /* Background iframe (página carregada internamente) */
      #kob-bg-frame {
         position: fixed;
         inset: 0;
         z-index: var(--z-bg);
         width: 100%;
         height: 100%;
         border: none;
         opacity: 0;
         transition: opacity 0.5s ease;
         background: var(--void);
      }
      #kob-bg-frame.visible {
         opacity: 1;
      }

      /* Overlay escuro sobre o iframe quando ativo (para não sumir o HUD) */
      #kob-frame-veil {
         position: fixed;
         inset: 0;
         z-index: calc(var(--z-bg) + 1);
         background: rgba(2,2,10,0.12);
         pointer-events: none;
         opacity: 0;
         transition: opacity 0.5s;
      }
      #kob-frame-veil.visible {
         opacity: 1;
      }

      /* Close frame button */
      #kob-frame-close {
         position: fixed;
         top: 14px;
         right: 14px;
         z-index: calc(var(--z-overlay) + 1);
         width: 36px;
         height: 36px;
         border-radius: 50%;
         border: 1px solid var(--border);
         background: rgba(2,2,10,0.85);
         color: var(--kob-voice-primary);
         font-size: 16px;
         cursor: pointer;
         display: none;
         align-items: center;
         justify-content: center;
         backdrop-filter: blur(8px);
         transition: all 0.2s;
      }
      #kob-frame-close.visible {
         display: flex;
      }
      #kob-frame-close:hover {
         background: rgba(201,168,76,0.15);
      }

      /* Demo screen (fundo quando nenhum iframe aberto) */
      .demo-screen {
         position: fixed;
         inset: 0;
         z-index: var(--z-bg);
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         pointer-events: none;
      }
      .demo-title {
         font-family: var(--display);
         font-weight: 900;
         font-size: clamp(1.6rem, 5vw, 3.5rem);
         background: linear-gradient(135deg, var(--cu-6) 0%, var(--cu-5) 40%, var(--cyan) 70%, var(--cu-6) 100%);
         background-size: 200% 200%;
         -webkit-background-clip: text;
         -webkit-text-fill-color: transparent;
         background-clip: text;
         animation: shimmer 6s ease-in-out infinite;
         letter-spacing: 0.1em;
         text-align: center;
      }
      .demo-sub {
         font-family: var(--mono);
         font-size: 0.7rem;
         color: var(--kob-voice-primary);
         letter-spacing: 0.5em;
         text-transform: uppercase;
         margin-top: 0.8rem;
         opacity: 0.6;
         animation: pulse-soft 4s ease-in-out infinite;
      }
      @keyframes shimmer {
         0%,100% {
            background-position: 0% 50%
         }

         50% {
            background-position: 100% 50%
         }
      }
      @keyframes pulse-soft {
         0%,100% {
            opacity: 0.4
         }

         50% {
            opacity: 0.9
         }
      }

      /* ═══════════════════════════════════════════════════════════════════
   SYMBOL-BAR
   ═══════════════════════════════════════════════════════════════════ */
      .symbol-bar {
         position: fixed;
         left: 16px;
         top: 50%;
         transform: translateY(-50%);
         z-index: var(--z-hud);

         display: flex;
         flex-direction: column;
         align-items: center;
         padding: 10px 8px;
         gap: 0;

         background: rgba(6,6,21,0.88);
         backdrop-filter: blur(20px) saturate(200%);
         -webkit-backdrop-filter: blur(20px) saturate(200%);
         border: 1px solid var(--border);
         box-shadow:
         0 0 0 1px rgba(0,0,0,0.5),
         0 8px 40px rgba(0,0,0,0.7),
         inset 0 1px 0 rgba(255,255,255,0.06),
         0 0 30px var(--arch-glow);

         border-radius: 28px;
         user-select: none;
         touch-action: none;

         transition:
         opacity 0.6s ease,
         top 0.35s cubic-bezier(0.175,0.885,0.32,1.275),
         left 0.35s cubic-bezier(0.175,0.885,0.32,1.275),
         border-radius 0.25s ease,
         border-color 0.5s ease,
         box-shadow 0.6s ease;
      }

      /* Linha decorativa cobre no topo */
      .symbol-bar::before {
         content: '';
         position: absolute;
         top: 0;
         left: 16%;
         right: 16%;
         height: 2px;
         border-radius: 0 0 4px 4px;
         background: linear-gradient(90deg, transparent, var(--kob-voice-primary), transparent);
         opacity: 0.7;
         transition: background 0.5s ease;
      }

      /* Estados */
      .symbol-bar.idle {
         opacity: 0.18;
      }
      .symbol-bar.idle:hover {
         opacity: 1;
      }
      .symbol-bar.is-dragging {
         opacity: 0.92;
         transition: none !important;
         will-change: top, left;
      }

      /* Snap states */
      .symbol-bar.snap-side {
         flex-direction: column;
         border-radius: 0 24px 24px 0;
         border-left: 0;
         left: 0 !important;
      }
      .symbol-bar.snap-side-right {
         flex-direction: column;
         border-radius: 24px 0 0 24px;
         border-right: 0;
      }
      .symbol-bar.snap-top {
         flex-direction: row;
         border-radius: 0 0 24px 24px;
         border-top: 0;
         top: 0 !important;
         transform: none !important;
      }
      .symbol-bar.floating {
         flex-direction: column;
         border-radius: 28px;
      }

      /* Collapsed */
      .symbol-bar.collapsed {
         min-width: 44px;
         min-height: 44px;
      }
      .symbol-bar.collapsed .kblx-carousel-viewport {
         height: 0 !important;
         overflow: hidden;
         opacity: 0;
      }
      .symbol-bar.collapsed .kblx-dots {
         display: none !important;
      }

      /* ── SYMBOL-WRAP ── */
      .symbol-wrap {
         display: flex;
         align-items: center;
         justify-content: center;
         flex-shrink: 0;
         transform-origin: center center;
         transform: scale(var(--kblx-item-scale, 1));
         opacity: var(--kblx-item-opacity, 1);
         z-index: var(--kblx-item-z, 1);
         transition: transform 0.28s ease, opacity 0.28s ease;
         position: relative;
      }

      /* ── SYMBOL-BUTTON ── */
      .symbol-button {
         width: 44px;
         height: 44px;
         border-radius: 14px;
         border: 1px solid var(--border);
         display: flex;
         align-items: center;
         justify-content: center;
         background: rgba(255,255,255,0.04);
         color: var(--mist);
         font-size: 16px;
         cursor: pointer;
         flex-shrink: 0;
         position: relative;
         outline: none;
         font-family: var(--body);
         transition: all 0.2s ease;
         /* Bevel cobre sutil */
         box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 2px 4px rgba(0,0,0,0.4);
      }
      .symbol-button:hover {
         background: rgba(255,255,255,0.1);
         border-color: var(--kob-voice-primary);
         color: var(--kob-voice-primary);
         box-shadow: 0 0 14px var(--arch-glow), inset 0 1px 0 rgba(255,255,255,0.1);
      }
      .symbol-button:active {
         transform: scale(0.86);
      }

      /* Main toggle – destaque */
      .symbol-button.main-toggle {
         background: linear-gradient(160deg, rgba(26,20,10,0.95), rgba(5,5,10,0.98));
         color: var(--kob-voice-primary);
         border-color: var(--kob-voice-primary);
         font-size: 22px;
         font-weight: bold;
         box-shadow:
         0 0 16px var(--arch-glow),
         inset 0 1px 0 rgba(255,255,255,0.1),
         inset 0 -1px 0 rgba(0,0,0,0.4);
      }
      .toggle-wrap {
         display: flex;
         align-items: center;
         justify-content: center;
         margin-bottom: 4px;
      }

      /* ── CAROUSEL VIEWPORT & TRACK ── */
      .kblx-carousel-viewport {
         position: relative;
         overflow: hidden;
         flex-shrink: 0;
         -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 82%, transparent 100%);
         mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 82%, transparent 100%);
         width: 60px;
         height: var(--kblx-vp-height, 180px);
         transition: height 0.4s ease;
      }
      .symbol-bar.snap-top .kblx-carousel-viewport {
         -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%);
         mask-image: linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%);
         width: var(--kblx-vp-height, 180px);
         height: 60px;
      }

      .kblx-carousel-track {
         display: flex;
         flex-direction: column;
         gap: 6px;
         transition: transform 0.32s cubic-bezier(0.25,0.8,0.25,1);
         will-change: transform;
      }
      .symbol-bar.snap-top .kblx-carousel-track {
         flex-direction: row;
      }
      .kblx-carousel-track.kblx-dragging {
         transition: none;
      }
      .kblx-carousel-track.kblx-dragging .symbol-wrap {
         transition: transform .06s linear, opacity .06s linear;
      }

      /* Dots */
      .kblx-dots {
         display: flex;
         flex-direction: column;
         align-items: center;
         gap: 3px;
         margin-top: 6px;
      }
      .symbol-bar.snap-top .kblx-dots {
         flex-direction: row;
         margin-top: 0;
         margin-left: 6px;
      }
      .kblx-dot {
         width: 5px;
         height: 5px;
         border-radius: 50%;
         background: rgba(255,255,255,0.2);
         cursor: pointer;
         transition: all 0.22s;
         flex-shrink: 0;
      }
      .kblx-dot.active {
         background: var(--kob-voice-primary);
         box-shadow: 0 0 6px var(--arch-glow);
         width: 5px;
         height: 8px;
         border-radius: 3px;
      }

      /* ── ORB BUTTON ── */
      #btn-arch {
         width: 48px;
         height: 48px;
         border-radius: 50% !important;
         border: 1.5px solid var(--kob-voice-primary) !important;
         background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05), rgba(0,0,0,0.6)) !important;
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 0;
         overflow: visible;
         box-shadow:
         0 0 20px var(--arch-glow),
         0 0 40px var(--arch-glow),
         inset 0 1px 0 rgba(255,255,255,0.15) !important;
         cursor: pointer;
         position: relative;
         outline: none;
         transition: all 0.35s ease;
         margin: 2px 0;
      }
      #btn-arch:hover {
         transform: scale(1.1);
         box-shadow: 0 0 30px var(--arch-glow-strong), 0 0 60px var(--arch-glow) !important;
      }
      .orb-microphone-container {
         width: 100%;
         height: 100%;
         display: flex;
         align-items: center;
         justify-content: center;
         position: relative;
      }
      .tts-orb-mini {
         width: 32px;
         height: 32px;
         display: flex;
         align-items: center;
         justify-content: center;
      }
      .orb {
         width: 100%;
         height: 100%;
         border-radius: 50%;
         display: grid;
         place-items: center;
      }
      .orb-core {
         width: 80%;
         height: 80%;
         border-radius: 50%;
         background:
         radial-gradient(circle at 28% 28%, var(--kob-voice-accent) 0%, rgba(255,255,255,0.08) 12%, transparent 55%),
         radial-gradient(circle at 72% 72%, var(--kob-voice-primary) 0%, var(--kob-voice-secondary) 100%);
         box-shadow:
         0 0 18px var(--kob-voice-primary),
         0 0 8px rgba(255,255,255,0.1) inset;
         animation: orbSpin var(--orb-speed) linear infinite;
         transition: background 0.5s ease, box-shadow 0.5s ease;
      }
      .speaking .orb-core {
         animation: orbSpin 1.8s linear infinite, orbPulse 0.45s ease-in-out infinite alternate;
         box-shadow: 0 0 30px var(--kob-voice-primary), 0 0 12px rgba(255,255,255,0.15) inset;
      }
      @keyframes orbSpin {
         to {
            transform: rotate(360deg);
         }
      }
      @keyframes orbPulse {
         from {
            transform: scale(1);
         }

         to {
            transform: scale(1.18);
         }
      }

      /* HUD info */
      .hud-info {
         font-size: 8px;
         font-family: var(--mono);
         color: var(--kob-voice-primary);
         text-transform: uppercase;
         letter-spacing: 1.5px;
         font-weight: 700;
         padding: 5px 6px;
         margin-top: 4px;
         border-top: 1px solid var(--border);
         pointer-events: none;
         white-space: nowrap;
         opacity: 0.75;
         writing-mode: vertical-rl;
         text-orientation: mixed;
         transition: color 0.5s ease, border-color 0.5s ease;
      }
      .symbol-bar.snap-top .hud-info {
         display: none;
      }

      /* ═══════════════════════════════════════════════════════════════════
   CHROMORFISMO – ESCAMAS DE TRANSIÇÃO (efeito de cor ao trocar arquétipo)
   ═══════════════════════════════════════════════════════════════════ */
      .chroma-ripple {
         position: fixed;
         inset: 0;
         z-index: calc(var(--z-hud) - 1);
         pointer-events: none;
         border-radius: 0;
         opacity: 0;
         background: radial-gradient(circle at var(--ripple-x, 50%) var(--ripple-y, 50%),
         var(--kob-voice-primary) 0%,
         color-mix(in srgb, var(--kob-voice-secondary) 60%, transparent) 30%,
         transparent 70%);
         animation: none;
      }
      .chroma-ripple.fire {
         animation: chromaFire 0.75s cubic-bezier(0.2,0.8,0.2,1) forwards;
      }
      @keyframes chromaFire {
         0% {
            opacity: 0.22;
            transform: scale(0.2);
         }
         40% {
            opacity: 0.18;
            transform: scale(1.4);
         }
         100% {
            opacity: 0;
            transform: scale(2.2);
         }
      }

      /* Scale / escama no bar ao trocar */
      .symbol-bar.chroma-transition {
         animation: chromaBar 0.45s ease forwards;
      }
      @keyframes chromaBar {
         0% {
            filter: brightness(2) saturate(3);
         }
         50% {
            filter: brightness(1.4) saturate(2);
         }
         100% {
            filter: brightness(1) saturate(1);
         }
      }

      /* ═══════════════════════════════════════════════════════════════════
   ARCH OVERLAY – SELETOR DE ARQUÉTIPO (carrossel 2D)
   ═══════════════════════════════════════════════════════════════════ */
      #arch-overlay {
         position: fixed;
         inset: 0;
         z-index: var(--z-overlay);
         display: none;
         align-items: flex-end;
         justify-content: center;
         background: rgba(2,2,10,0.75);
         backdrop-filter: blur(8px);
         padding-bottom: 20px;
      }
      #arch-overlay.open {
         display: flex;
      }
      .arch-wheel {
         display: flex;
         flex-wrap: wrap;
         gap: 8px;
         justify-content: center;
         max-width: 380px;
         background: linear-gradient(135deg, rgba(10,10,30,0.97), rgba(5,5,18,0.99));
         border: 1px solid var(--border);
         border-radius: 22px;
         padding: 18px;
         box-shadow: 0 0 60px var(--arch-glow), 0 30px 60px rgba(0,0,0,0.8);
         animation: kblx-in .28s cubic-bezier(.34,1.56,.64,1) both;
      }
      .arch-wheel-title {
         width: 100%;
         text-align: center;
         font-family: var(--mono);
         font-size: 0.6rem;
         color: var(--kob-voice-primary);
         letter-spacing: 0.4em;
         text-transform: uppercase;
         opacity: 0.6;
         margin-bottom: 6px;
      }
      .arch-chip {
         display: flex;
         flex-direction: column;
         align-items: center;
         gap: 4px;
         padding: 8px 10px;
         border-radius: 12px;
         border: 1px solid transparent;
         cursor: pointer;
         transition: all 0.18s;
         font-family: var(--mono);
         min-width: 56px;
      }
      .arch-chip:hover {
         transform: scale(1.1);
         border-color: currentColor;
         background: rgba(255,255,255,0.04);
      }
      .arch-chip.active {
         border-color: currentColor;
         background: rgba(255,255,255,0.06);
         transform: scale(1.05);
      }
      .arch-chip .a-orb {
         width: 26px;
         height: 26px;
         border-radius: 50%;
         box-shadow: 0 0 10px currentColor;
      }
      .arch-chip .a-name {
         font-size: 7px;
         letter-spacing: 1.5px;
         text-transform: uppercase;
         color: rgba(255,255,255,0.55);
      }
      .arch-chip .a-freq {
         font-size: 6px;
         color: rgba(255,255,255,0.3);
         letter-spacing: 1px;
      }

      /* ═══════════════════════════════════════════════════════════════════
   CARD DE ARQUÉTIPO (long-press no ORB)
   ═══════════════════════════════════════════════════════════════════ */
      #arch-card-overlay {
         position: fixed;
         inset: 0;
         z-index: var(--z-overlay);
         display: none;
         align-items: center;
         justify-content: center;
         background: rgba(2,2,10,0.82);
         backdrop-filter: blur(10px);
      }
      #arch-card-overlay.open {
         display: flex;
      }
      .arch-card-panel {
         background: linear-gradient(160deg, rgba(12,10,28,0.99), rgba(6,5,16,0.99));
         border: 1px solid var(--border);
         border-radius: 22px;
         padding: 0;
         width: min(360px, 92vw);
         overflow: hidden;
         box-shadow: 0 0 80px var(--arch-glow), 0 30px 60px rgba(0,0,0,0.85);
         animation: kblx-in .3s cubic-bezier(.34,1.56,.64,1) both;
         position: relative;
      }
      /* Topo com gradiente do arquétipo */
      .arch-card-header {
         padding: 24px 22px 20px;
         background: linear-gradient(160deg,

      /* ══════════════════════════════════════════════════════════
   2. ESTADO
   ══════════════════════════════════════════════════════════ */
      let currentIdx = ARCHETYPES.findIndex(a => a.name === 'kobllux');
      let archCardIdx = currentIdx;

      /* ══════════════════════════════════════════════════════════
   3. UTILS
   ══════════════════════════════════════════════════════════ */
      function toast(msg, ms = 2200) {
         const el = document.getElementById('kblx-toast');
         el.textContent = msg;
         el.classList.add('show');
         clearTimeout(el._t);
         el._t = setTimeout(() => el.classList.remove('show'), ms);
      }

      function hexToRgba(hex, a) {
         const r = parseInt(hex.slice(1, 3), 16);
         const g = parseInt(hex.slice(3, 5), 16);
         const b = parseInt(hex.slice(5, 7), 16);
         return `rgba(${r},${g},${b},${a})`;
      }

      function buildOrbGradient(arch) {
         return `radial-gradient(circle at 35% 30%, ${arch.a} 0%, rgba(255,255,255,0.05) 14%, transparent 55%),
         radial-gradient(circle at 70% 72%, ${arch.p} 0%, ${arch.s} 100%)`;
      }

      /* ══════════════════════════════════════════════════════════
   4. APLICAR ARQUÉTIPO + CHROMORFISMO
   ══════════════════════════════════════════════════════════ */
      function applyArchetype(idx, triggerX, triggerY, animate = true) {
         currentIdx = ((idx % ARCHETYPES.length) + ARCHETYPES.length) % ARCHETYPES.length;
         const arch = ARCHETYPES[currentIdx];
         const root = document.documentElement;

         root.style.setProperty('--kob-voice-primary', arch.p);
         root.style.setProperty('--kob-voice-secondary', arch.s);
         root.style.setProperty('--kob-voice-accent', arch.a);
         root.style.setProperty('--arch-color', arch.p);
         root.style.setProperty('--arch-glow', hexToRgba(arch.p, 0.32));
         root.style.setProperty('--arch-glow-strong', hexToRgba(arch.p, 0.6));
         root.style.setProperty('--arch-emoji', `'${arch.e}'`);

         // Orb core
         const orbCore = document.querySelector('.orb-core');
         if (orbCore) orbCore.style.background = buildOrbGradient(arch);

         // HUD label
         const hud = document.getElementById('hudStatus');
         if (hud) hud.textContent = arch.name.toUpperCase();

         // Wheel dots
         document.querySelectorAll('.arch-chip').forEach(c => {
            c.classList.toggle('active', c.dataset.archName === arch.name);
         });

         // CHROMORFISMO – ripple
         if (animate) {
            const ripple = document.getElementById('chromaRipple');
            const bar = document.getElementById('symbolBar');
            const barRect = bar.getBoundingClientRect();
            const rx = triggerX ?? (barRect.left + barRect.width / 2);
            const ry = triggerY ?? (barRect.top + barRect.height / 2);
            ripple.style.setProperty('--ripple-x', (rx / window.innerWidth * 100) + '%');
            ripple.style.setProperty('--ripple-y', (ry / window.innerHeight * 100) + '%');
            ripple.style.background = `radial-gradient(circle at ${rx/window.innerWidth*100}% ${ry/window.innerHeight*100}%,
            ${arch.p} 0%, ${hexToRgba(arch.s, 0.5)} 30%, transparent 70%)`;
            ripple.classList.remove('fire');
            void ripple.offsetWidth;
            ripple.classList.add('fire');

            // Bar shimmer
            bar.classList.remove('chroma-transition');
            void bar.offsetWidth;
            bar.classList.add('chroma-transition');
            setTimeout(() => bar.classList.remove('chroma-transition'), 500);
         }

         try {
            localStorage.setItem('kob_arch', arch.name);
         } catch(e) {}
      }
      
      
      
      
      

      /* ══════════════════════════════════════════════════════════
   5. CARROSSEL
   ══════════════════════════════════════════════════════════ */
      const VISIBLE = 4; // botões visíveis por vez
      const ITEM_H = 52; // px por item (44px btn + 8px gap)
      const GAP = 8;

      // Botões do carrossel
      const NAV_BUTTONS = [{
         label: '◀',
         id: 'btn-prev',
         url: null,
         title: 'Bloco anterior'
      },
         {
            label: '▶',
            id: 'btn-play',
            url: null,
            title: 'Play / Pause TTS'
         },
         {
            label: '■',
            id: 'tts-stop',
            url: null,
            title: 'Parar TTS'
         },
         {
            label: '▶▶',
            id: 'btn-next',
            url: null,
            title: 'Próximo bloco'
         },
         {
            label: '🌌',
            id: 'btn-phi',
            url: 'about:blank',
            title: 'Phi',
            dataId: 'phi'
         },
         {
            label: '🛋',
            id: 'btn-viv',
            url: 'about:blank',
            title: 'Viv',
            dataId: 'viv'
         },
         {
            label: '◌',
            id: 'btn-home',
            url: 'about:blank',
            title: 'Home',
            dataId: 'home'
         },
         {
            label: '◘',
            id: 'btn-doc',
            url: 'about:blank',
            title: 'Doc',
            dataId: 'doc'
         },
      ];

      let carouselIdx = 0;
      let carouselDragging = false;
      let carouselDragStart = 0;
      let carouselDragDelta = 0;

      function buildCarousel() {
         const bar = document.getElementById('symbolBar');

         // Viewport
         const vp = document.createElement('div');
         vp.className = 'kblx-carousel-viewport';
         vp.style.height = (VISIBLE * ITEM_H - GAP) + 'px';
         bar.querySelector('.hud-info').before(vp);

         // Track
         const track = document.createElement('div');
         track.className = 'kblx-carousel-track';
         track.style.gap = GAP + 'px';
         vp.appendChild(track);

         // Dots
         const dots = document.createElement('div');
         dots.className = 'kblx-dots';
         bar.querySelector('.hud-info').before(dots);

         // Populate items
         NAV_BUTTONS.forEach(def => {
            const wrap = document.createElement('div');
            wrap.className = 'symbol-wrap';

            const btn = document.createElement('button');
            btn.className = 'symbol-button';
            btn.id = def.id;
            btn.title = def.title;
            btn.textContent = def.label;
            btn.style.position = 'relative';
            if (def.url !== null) btn.dataset.url = def.url;
            if (def.dataId) btn.dataset.id = def.dataId;

            // Long-press ring for nav buttons
            if (def.url !== null) {
               const ring = document.createElement('div');
               ring.className = 'kblx-ring';
               ring.innerHTML = '<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="nav-ring-c"/></svg>';
               btn.appendChild(ring);
               setupNavLongPress(btn);
            }

            wrap.appendChild(btn);
            track.appendChild(wrap);
         });

         // Wire nav buttons
         document.getElementById('btn-prev')?.addEventListener('click',
            () => applyArchetype(currentIdx - 1));
         document.getElementById('btn-next')?.addEventListener('click',
            () => applyArchetype(currentIdx + 1));
         document.getElementById('btn-play')?.addEventListener('click',
            togglePlay);
         document.getElementById('tts-stop')?.addEventListener('click',
            stopTTS);

         // Wire url buttons
         ['btn-phi', 'btn-viv', 'btn-home', 'btn-doc'].forEach(id => {
            document.getElementById(id)?.addEventListener('click', function(e) {
               if (this._longPressed) {
                  this._longPressed = false; return;
               }
               const url = this.dataset.url;
               if (url && url !== 'about:blank') loadInternalFrame(url);
            });
         });

         // Drag
         track.addEventListener('mousedown', e => {
            carouselDragging = true; carouselDragStart = e.clientY; carouselDragDelta = 0;
            track.classList.add('kblx-dragging');
         });
         document.addEventListener('mousemove', e => {
            if (!carouselDragging) return;
            carouselDragDelta = e.clientY - carouselDragStart;
            applyTrack(carouselIdx * ITEM_H - carouselDragDelta, false, track);
            applyCoverflow(carouselIdx * ITEM_H - carouselDragDelta, track);
         });
         document.addEventListener('mouseup',
            () => {
               if (!carouselDragging) return;
               carouselDragging = false;
               track.classList.remove('kblx-dragging');
               snapCarousel(carouselIdx - Math.round(carouselDragDelta / ITEM_H), track, dots);
            });
         track.addEventListener('touchstart',
            e => {
               carouselDragStart = e.touches[0].clientY; carouselDragDelta = 0; carouselDragging = true;
               track.classList.add('kblx-dragging');
            },
            {
               passive: true
            });
         track.addEventListener('touchmove',
            e => {
               if (!carouselDragging) return;
               carouselDragDelta = e.touches[0].clientY - carouselDragStart;
               applyTrack(carouselIdx * ITEM_H - carouselDragDelta, false, track);
               applyCoverflow(carouselIdx * ITEM_H - carouselDragDelta, track);
            },
            {
               passive: true
            });
         track.addEventListener('touchend',
            () => {
               if (!carouselDragging) return;
               carouselDragging = false; track.classList.remove('kblx-dragging');
               snapCarousel(carouselIdx - Math.round(carouselDragDelta / ITEM_H), track, dots);
            });
         vp.addEventListener('wheel',
            e => {
               e.preventDefault();
               snapCarousel(carouselIdx + (e.deltaY > 0 ? 1: -1), track, dots);
            },
            {
               passive: false
            });

         snapCarousel(0,
            track,
            dots);
      }

      function getMaxIdx() {
         return Math.max(0,
            NAV_BUTTONS.length - VISIBLE);
      }

      function applyTrack(offsetPx, animate, track) {
         track.style.transition = animate
         ? 'transform 0.32s cubic-bezier(0.25,0.8,0.25,1)': 'none';
         track.style.transform = `translateY(${-offsetPx}px)`;
      }

      function applyCoverflow(offsetPx, track) {
         const items = track.querySelectorAll('.symbol-wrap');
         const centerI = offsetPx / ITEM_H + (VISIBLE - 1) / 2;
         items.forEach((item, i) => {
            const d = Math.abs(i - centerI);
            const scale = d < 0.5 ? 1: d < 1.5 ? 1 - (d - 0.5) * 0.26: 0.74;
            const opacity = d < 0.5 ? 1: d < 1.5 ? 1 - (d - 0.5) * 0.38: 0.62;
            const zIdx = d < 0.5 ? 10: d < 1.5 ? 5: 1;
            item.style.setProperty('--kblx-item-scale', scale.toFixed(3));
            item.style.setProperty('--kblx-item-opacity', opacity.toFixed(3));
            item.style.setProperty('--kblx-item-z', zIdx);
         });
      }

      function renderDots(track, dots) {
         dots.innerHTML = '';
         const pages = Math.ceil(NAV_BUTTONS.length / VISIBLE);
         const active = Math.floor(carouselIdx / VISIBLE);
         for (let i = 0; i < pages; i++) {
            const d = document.createElement('div');
            d.className = 'kblx-dot' + (i === active ? ' active': '');
            d.addEventListener('click', () => snapCarousel(i * VISIBLE, track, dots));
            dots.appendChild(d);
         }
         dots.style.display = pages <= 1 ? 'none': 'flex';
      }

      function snapCarousel(idx, track, dots) {
         carouselIdx = Math.max(0, Math.min(Math.round(idx), getMaxIdx()));
         const offsetPx = carouselIdx * ITEM_H;
         applyTrack(offsetPx, true, track);
         applyCoverflow(offsetPx, track);
         renderDots(track, dots);
      }

      /* ══════════════════════════════════════════════════════════
   6. IFRAME INTERNO
   ══════════════════════════════════════════════════════════ */
      function loadInternalFrame(url) {
         const frame = document.getElementById('kob-bg-frame');
         const veil = document.getElementById('kob-frame-veil');
         const close = document.getElementById('kob-frame-close');
         frame.src = url;
         frame.classList.add('visible');
         veil.classList.add('visible');
         close.classList.add('visible');
         toast('⊙ CARREGANDO: ' + url.split('/').pop());
      }
      document.getElementById('kob-frame-close').addEventListener('click', () => {
         const frame = document.getElementById('kob-bg-frame');
         const veil = document.getElementById('kob-frame-veil');
         const close = document.getElementById('kob-frame-close');
         frame.classList.remove('visible');
         veil.classList.remove('visible');
         close.classList.remove('visible');
         setTimeout(() => {
            frame.src = 'about:blank';
         }, 500);
      });

      /* ══════════════════════════════════════════════════════════
   7. ARCH OVERLAY / WHEEL
   ══════════════════════════════════════════════════════════ */
      function buildArchWheel() {
         const wheel = document.getElementById('archWheel');
         ARCHETYPES.forEach((arch, idx) => {
            const chip = document.createElement('div');
            chip.className = 'arch-chip';
            chip.dataset.archName = arch.name;
            chip.style.color = arch.p;
            chip.innerHTML = `
            <div class="a-orb" style="background: radial-gradient(circle at 35% 30%, ${arch.a} 0%, transparent 50%), radial-gradient(circle at 70% 70%, ${arch.p} 0%, ${arch.s} 100%);"></div>
            <div class="a-name">${arch.name}</div>
            <div class="a-freq">${arch.f}Hz</div>`;
            chip.addEventListener('click', () => {
               const r = chip.getBoundingClientRect();
               applyArchetype(idx, r.left + r.width/2, r.top + r.height/2);
               closeArchOverlay();
            });
            wheel.appendChild(chip);
         });
      }

      document.getElementById('btn-arch').addEventListener('click', () => {
         if (document.getElementById('btn-arch')._longPressed) {
            document.getElementById('btn-arch')._longPressed = false;
            return;
         }
         openArchOverlay();
      });

      function openArchOverlay() {
         document.getElementById('arch-overlay').classList.add('open');
      }
      function closeArchOverlay() {
         document.getElementById('arch-overlay').classList.remove('open');
      }
      document.getElementById('arch-overlay').addEventListener('click', e => {
         if (e.target === document.getElementById('arch-overlay')) closeArchOverlay();
      });

      /* ══════════════════════════════════════════════════════════
   8. ARCH CARD (long-press no ORB)
   ══════════════════════════════════════════════════════════ */
      function openArchCard(idx) {
         archCardIdx = ((idx % ARCHETYPES.length) + ARCHETYPES.length) % ARCHETYPES.length;
         renderArchCard();
         document.getElementById('arch-card-overlay').classList.add('open');
      }
      function closeArchCard() {
         document.getElementById('arch-card-overlay').classList.remove('open');
      }

      function renderArchCard() {
         const arch = ARCHETYPES[archCardIdx];
         document.getElementById('acp-chip').textContent = arch.opcode + ' · ' + arch.name.toUpperCase();
         document.getElementById('acp-name').textContent = arch.name.toUpperCase();
         document.getElementById('acp-role').textContent = arch.r;
         document.getElementById('acp-freq').innerHTML = `${arch.f} <span>Hz</span>`;
         document.getElementById('acp-emoji').textContent = arch.e;
         document.getElementById('acp-nav-name').textContent = arch.name.toUpperCase();
         document.getElementById('acp-placeholder-text').innerHTML =
         `[ ${arch.name.toUpperCase()} · MÓDULO ]<br>Conteúdo do arquétipo será linkado aqui.`;

         // Cores do card
         document.documentElement.style.setProperty('--arch-color',
            arch.p);
         document.documentElement.style.setProperty('--arch-glow',
            hexToRgba(arch.p, 0.32));

         // Orb do card
         const orbEl = document.getElementById('acp-orb');
         orbEl.style.background = `radial-gradient(circle at 35% 30%, ${arch.a} 0%, rgba(255,255,255,0.06) 15%, transparent 55%),
         radial-gradient(circle at 70% 72%, ${arch.p} 0%, ${arch.s} 100%)`;
      }

      document.getElementById('acp-close').addEventListener('click', closeArchCard);
      document.getElementById('acp-select').addEventListener('click', () => {
         applyArchetype(archCardIdx);
         closeArchCard();
         toast('⊙ ATIVADO: ' + ARCHETYPES[currentIdx].name.toUpperCase() + ' · ' + ARCHETYPES[currentIdx].f + 'Hz');
      });
      document.getElementById('acp-prev').addEventListener('click', () => {
         archCardIdx = ((archCardIdx - 1 + ARCHETYPES.length) % ARCHETYPES.length); renderArchCard();
      });
      document.getElementById('acp-next').addEventListener('click', () => {
         archCardIdx = ((archCardIdx + 1) % ARCHETYPES.length); renderArchCard();
      });
      document.getElementById('arch-card-overlay').addEventListener('click', e => {
         if (e.target === document.getElementById('arch-card-overlay')) closeArchCard();
      });

      /* ══════════════════════════════════════════════════════════
   9. LONG-PRESS ORB  (600ms → card arquétipo)
   ══════════════════════════════════════════════════════════ */
      (function setupOrbLongPress() {
         const btn = document.getElementById('btn-arch');
         const circle = document.getElementById('orb-ring-circle');
         const CIRC = 138;
         const DURATION = 600;
         let timer,
         raf,
         t0;

         function start() {
            btn._longPressed = false;
            t0 = Date.now();
            timer = setTimeout(() => {
               btn._longPressed = true;
               cancelAnimationFrame(raf);
               if (circle) circle.style.strokeDashoffset = CIRC;
               openArchCard(currentIdx);
            },
               DURATION);
            (function tick() {
               if (t0 === null) return;
               const p = Math.min((Date.now() - t0) / DURATION, 1);
               if (circle) {
                  circle.style.transition = 'none'; circle.style.strokeDashoffset = CIRC * (1 - p);
               }
               if (p < 1) raf = requestAnimationFrame(tick);
            })();
         }
         function cancel() {
            clearTimeout(timer); cancelAnimationFrame(raf); t0 = null;
            if (circle) {
               circle.style.transition = 'stroke-dashoffset .2s ease'; circle.style.strokeDashoffset = CIRC;
            }
         }
         btn.addEventListener('pointerdown', start, {
            passive: true
         });
         btn.addEventListener('pointerup', cancel, {
            passive: true
         });
         btn.addEventListener('pointerleave', cancel, {
            passive: true
         });
      })();

      /* ══════════════════════════════════════════════════════════
   10. LONG-PRESS NAV BUTTONS (3s → editor URL)
   ══════════════════════════════════════════════════════════ */
      function setupNavLongPress(btn) {
         const CIRC = 113;
         const DURATION = 3000;
         let timer, raf, t0;

         function start() {
            btn._longPressed = false;
            t0 = Date.now();
            timer = setTimeout(() => {
               btn._longPressed = true;
               cancelAnimationFrame(raf);
               const c = btn.querySelector('.nav-ring-c');
               if (c) {
                  c.style.transition = 'stroke-dashoffset .2s ease'; c.style.strokeDashoffset = CIRC;
               }
               openUrlEditor(btn);
            },
               DURATION);
            (function tick() {
               if (t0 === null) return;
               const p = Math.min((Date.now() - t0) / DURATION, 1);
               const c = btn.querySelector('.nav-ring-c');
               if (c) {
                  c.style.transition = 'none'; c.style.strokeDashoffset = CIRC * (1 - p);
               }
               if (p < 1) raf = requestAnimationFrame(tick);
            })();
         }
         function cancel() {
            clearTimeout(timer); cancelAnimationFrame(raf); t0 = null;
            const c = btn.querySelector('.nav-ring-c');
            if (c) {
               c.style.transition = 'stroke-dashoffset .2s ease'; c.style.strokeDashoffset = CIRC;
            }
         }
         btn.addEventListener('pointerdown', start, {
            passive: true
         });
         btn.addEventListener('pointerup', cancel, {
            passive: true
         });
         btn.addEventListener('pointerleave', cancel, {
            passive: true
         });
      }

      let urlEditorTarget = null;
      function openUrlEditor(btn) {
         urlEditorTarget = btn;
         const id = btn.dataset.id || btn.id || '?';
         document.getElementById('kblx-ttl').textContent = 'Botão · ' + id;
         document.getElementById('kblx-inp').value = btn.dataset.url || '';
         document.getElementById('kblx-back').classList.add('open');
         setTimeout(() => document.getElementById('kblx-inp').focus(), 80);
      }
      document.getElementById('kblx-btn-save').addEventListener('click', () => {
         if (urlEditorTarget) {
            const v = document.getElementById('kblx-inp').value.trim();
            if (v) {
               urlEditorTarget.dataset.url = v; toast('✓ URL atualizado');
            }
         }
         document.getElementById('kblx-back').classList.remove('open');
      });
      document.getElementById('kblx-btn-close').addEventListener('click', () => document.getElementById('kblx-back').classList.remove('open'));
      document.getElementById('kblx-back').addEventListener('click', e => {
         if (e.target === document.getElementById('kblx-back')) document.getElementById('kblx-back').classList.remove('open');
      });

      /* ══════════════════════════════════════════════════════════
   11. TTS
   ══════════════════════════════════════════════════════════ */
      let currentUtterance = null;
      function speak(text) {
         if (!window.speechSynthesis) return;
         stopTTS();
         const arch = ARCHETYPES[currentIdx];
         const utt = new SpeechSynthesisUtterance(text);
         utt.lang = 'pt-BR'; utt.pitch = 1.0; utt.rate = 1.0;
         utt.onstart = () => document.getElementById('main-orb').classList.add('speaking');
         utt.onend = utt.onerror = () => document.getElementById('main-orb').classList.remove('speaking');
         currentUtterance = utt;
         speechSynthesis.speak(utt);
      }
      function stopTTS() {
         if (window.speechSynthesis) speechSynthesis.cancel(); document.getElementById('main-orb').classList.remove('speaking');
      }
      function togglePlay() {
         if (!window.speechSynthesis) return;
         if (speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.pause();
         else if (speechSynthesis.paused) speechSynthesis.resume();
         else {
            const a = ARCHETYPES[currentIdx]; speak(`Arquétipo ${a.name}. Frequência ${a.f} Hertz. ${a.r}.`);
         }
      }

      /* ══════════════════════════════════════════════════════════
   12. DRAG & SNAP (symbol-bar)
   ══════════════════════════════════════════════════════════ */
      const bar = document.getElementById('symbolBar');
      let sbDragging = false, sbOffX = 0, sbOffY = 0;

      bar.style.top = (window.innerHeight / 2 - bar.offsetHeight / 2) + 'px';
      bar.style.left = '16px'; bar.style.transform = 'none';

      bar.addEventListener('pointerdown', e => {
         if (e.target.closest('button, .kblx-carousel-track, .kblx-dots')) return;
         sbDragging = true;
         bar.setPointerCapture(e.pointerId);
         const r = bar.getBoundingClientRect();
         sbOffX = e.clientX - r.left; sbOffY = e.clientY - r.top;
         bar.classList.add('is-dragging');
         bar.classList.remove('snap-side', 'snap-side-right', 'snap-top', 'floating');
         bar.style.transform = 'none';
      });
      window.addEventListener('pointermove', e => {
         if (!sbDragging) return;
         let x = Math.max(0, Math.min(window.innerWidth - bar.offsetWidth, e.clientX - sbOffX));
         let y = Math.max(0, Math.min(window.innerHeight - bar.offsetHeight, e.clientY - sbOffY));
         bar.style.left = x + 'px'; bar.style.top = y + 'px';
      });
      window.addEventListener('pointerup', () => {
         if (!sbDragging) return;
         sbDragging = false; bar.classList.remove('is-dragging');
         snapBar();
      });
      
      
      
      
      

      function snapBar() {
         const r = bar.getBoundingClientRect();
         const cx = r.left + r.width / 2;
         const cy = r.top + r.height / 2;
         const W = window.innerWidth, H = window.innerHeight;
         const dl = cx, dr = W - cx, dt = cy;
         if (dl <= 60 || dl <= dr && dl <= dt * 1.5) {
            bar.classList.add('snap-side');
            bar.style.left = '0'; bar.style.top = Math.max(0, Math.min(H - bar.offsetHeight, r.top)) + 'px';
         } else if (dr < dl && dr < 60) {
            bar.classList.add('snap-side-right');
            bar.style.left = (W - bar.offsetWidth) + 'px';
            bar.style.top = Math.max(0, Math.min(H - bar.offsetHeight, r.top)) + 'px';
         } else if (dt < 50) {
            bar.classList.add('snap-top');
            bar.style.top = '0'; bar.style.left = Math.max(0, Math.min(W - bar.offsetWidth, r.left)) + 'px';
         } else {
            bar.classList.add('floating');
         }
      }

      /* ══════════════════════════════════════════════════════════
   13. IDLE TIMER
   ══════════════════════════════════════════════════════════ */
      let idleTimer;
      function resetIdle() {
         bar.classList.remove('idle'); clearTimeout(idleTimer);
         idleTimer = setTimeout(() => {
            if (!sbDragging) bar.classList.add('idle');
         },
            4000);
      }
      ['pointerdown', 'pointermove', 'touchstart', 'mousemove'].forEach(ev =>
         document.addEventListener(ev, resetIdle, {
            passive: true
         }));
      resetIdle();

      /* ══════════════════════════════════════════════════════════
   14. TOGGLE COLLAPSED
   ══════════════════════════════════════════════════════════ */
      document.getElementById('toggleBtn').addEventListener('click', () => {
         bar.classList.toggle('collapsed');
      });

      /* ══════════════════════════════════════════════════════════
   15. INIT
   ══════════════════════════════════════════════════════════ */
      buildArchWheel();
      buildCarousel();

      const saved = (() => {
         try {
            return localStorage.getItem('kob_arch');
         } catch(e) {
            return null;
         }})();
      const savedIdx = saved ? ARCHETYPES.findIndex(a => a.name === saved): -1;
      applyArchetype(savedIdx >= 0 ? savedIdx: ARCHETYPES.findIndex(a => a.name === 'kobllux'), null, null, false);

      console.log('KOBLLUX · SymbolBar v2 · Carousel + Chromorfismo Cobre · VERDADE×INTEGRAR÷Δ=∞');
      
      
   </script>
