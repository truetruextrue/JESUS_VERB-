<section id="v-apps" class="view">
                                                                                                                                    <div class="grid">
                                                                                                                                      <div class="card fx-trans fx-lift" style="display:block">
                                                                                                                                        <div class="grid" style="gap:8px">
                                                                                                                                          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                                                                                                                                            <!-- Removemos a busca e o sort. Agora apenas a opção de abrir dentro e o botão para mostrar locais -->
                                                                                                                                              <label class="mut" style="display:inline-flex;gap:6px;align-items:center">
                                                                                                                                              <input id="openInside" type="checkbox" /> abrir dentro
                                                                                                                                              </label>
                                                                                                                                              <button id="btnToggleLocal" class="btn fx-trans fx-press ring">
                                                                                                                                                <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/folder-open.svg" alt="Locais" width="16" height="16" onerror="this.onerror=null;this.src='icons/folder-open.svg'" style="margin-right:4px">
                                                                                                                                                  Mostrar Locais<span class="ripple">
                                                                                                                                                </span>
                                                                                                                                              </button>
                                                                                                                                            </div>
                                                                                                                                            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                                                                                                                                              <!-- Aceita arquivos .json além de HTML/TXT para permitir upload de catálogos personalizados -->
                                                                                                                                              <input id="fileLocal" type="file" accept=".html,.htm,.txt,.json" multiple class="input ring" />
                                                                                                                                              <button id="btnImport" class="btn fx-trans fx-press ring">
                                                                                                                                                <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/plus-circle.svg" alt="Adicionar" width="16" height="16" onerror="this.onerror=null;this.src='icons/plus-circle.svg'" style="margin-right:4px">
                                                                                                                                                  Adicionar Locais<span class="ripple">
                                                                                                                                                </span>
                                                                                                                                              </button>
                                                                                                                                              <button id="btnExport" class="btn fx-trans fx-press ring">
                                                                                                                                                <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/file-export.svg" alt="Exportar" width="16" height="16" onerror="this.onerror=null;this.src='icons/file-export.svg'" style="margin-right:4px">
                                                                                                                                                  Exportar Locais<span class="ripple">
                                                                                                                                                </span>
                                                                                                                                              </button>
                                                                                                                                              <button id="btnClear" class="btn fx-trans fx-press ring">
                                                                                                                                                <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/trash.svg" alt="Limpar" width="16" height="16" onerror="this.onerror=null;this.src='icons/trash.svg'" style="margin-right:4px">
                                                                                                                                                  Limpar Locais<span class="ripple">
                                                                                                                                                </span>
                                                                                                                                              </button>
                                                                                                                                            </div>
                                                                                                                                            <div id="appsCount" class="mut">—</div>
                                                                                                                                            </div>
                                                                                                                                          </div>
                                                                                                                                          <div id="appsWrap" class="apps-wrap">
                                                                                                                                          </div>
                                                                                                                                        </div>
                                                                                                                                      
  <!-- ╔═══ BLUECUP LOCAL PANEL · embedded as 2ª camada do v-apps ═══════════╗ -->
<div class="bluecup-local-shell" data-source="BlueCup_TRINITY_HYBRID">
  <div class="card localAppsCard">
  <details>
    <summary>
      <span class="appsSummary">
        <span class="appsSummary-dot"></span>
        <span class="appsSummary-title">APPS • LOCAIS</span>
        <span class="appsSummary-sub">upload / editar / abrir #local:</span>
      </span>
      <span class="chev">▸</span>
    </summary>
    <div class="content">
      <div class="appsToolbar">
        <div class="btnRow" style="margin:0">
          <button id="localUploadBtn" class="appBtn primary" type="button">Upload HTML</button>
          <button id="localNewBtn" class="appBtn" type="button">Novo Local</button>
          <button id="localExportBtn" class="appBtn" type="button">Exportar Locais</button>
          <button id="localImportBtn" class="appBtn" type="button">Importar Locais</button>
        </div>
        <input id="localUploadInput" type="file" accept=".html,text/html" multiple hidden />
        <input id="localImportInput" type="file" accept=".json,application/json" hidden />
      </div>

      <div id="localAppsGrid" class="appsGrid"></div>

      <div class="appsFooter tiny" id="localAppsHint">
        HTMLs que você subir aqui viram cards no Hub e abrem como <code>#local:chave</code>.
      </div>
    </div>
  </details>
</div>
</div>
<!-- ╚═══════════════════════════════════════════════════════════════════════╝ -->
</section>
