<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.btn { font-family:var(--font-ui); font-weight:700; cursor:pointer; transition:.18s; }
</style></head><body><div class="card" style="gap:14px">
  <div class="eyebrow">Buttons</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn" style="padding:.75rem 1.5rem;border-radius:.5rem;border:none;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:12px">⚡ ATIVAR SISTEMAS</button>
    <button class="btn" style="padding:.5rem 1rem;border-radius:.5rem;border:1px solid #3b82f6;background:rgba(59,130,246,0.1);color:#fff;font-size:11px">Abrir DNA</button>
    <button class="btn" style="padding:.5rem 1rem;border-radius:.5rem;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-size:11px">🔍 Diagnóstico</button>
    <button class="btn" style="padding:5px 12px;border-radius:6px;border:1px solid rgba(16,185,129,0.4);background:rgba(16,185,129,0.12);color:#10b981;font-size:10px">SALVAR</button>
    <button class="btn" style="width:30px;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:#9aa4c8;display:flex;align-items:center;justify-content:center">↺</button>
  </div>
  <div style="font-family:var(--font-code);font-size:9px;color:#9aa4c8">Primary · outlined · ghost · pill-save · tool-btn 30×30</div>
</div></body></html>
