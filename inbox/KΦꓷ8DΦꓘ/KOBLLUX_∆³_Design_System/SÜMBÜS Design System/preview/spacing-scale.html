<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.row { display:flex; gap:12px; align-items:flex-end; }
.s { background:rgba(0,245,255,0.18); border-left:2px solid #00f5ff; height:28px; display:flex; align-items:center; }
.lab { font-family:var(--font-code); font-size:9px; color:#9aa4c8; margin-top:6px; }
.unit { display:flex; flex-direction:column; align-items:flex-start; }
</style></head><body><div class="card" style="gap:10px">
  <div class="eyebrow">Spacing · 4pt base</div>
  <div class="row">

    <div class="unit"><div class="s" style="width:8px"></div><div class="lab">2 · 8</div></div>
    <div class="unit"><div class="s" style="width:12px"></div><div class="lab">3 · 12</div></div>
    <div class="unit"><div class="s" style="width:16px"></div><div class="lab">4 · 16</div></div>
    <div class="unit"><div class="s" style="width:20px"></div><div class="lab">5 · 20</div></div>
    <div class="unit"><div class="s" style="width:24px"></div><div class="lab">6 · 24</div></div>
    <div class="unit"><div class="s" style="width:32px"></div><div class="lab">8 · 32</div></div>
    <div class="unit"><div class="s" style="width:40px"></div><div class="lab">10 · 40</div></div>
    <div class="unit"><div class="s" style="width:48px"></div><div class="lab">12 · 48</div></div>
  </div>
</div></body></html>
