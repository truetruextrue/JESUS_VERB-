<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.archs { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }

.a .label { font-family:var(--font-code); font-size:9.5px; font-weight:700; color:#050811; }
.a .desc { font-family:var(--font-code); font-size:8px; color:rgba(5,8,17,0.7); }
.dim .label, .dim .desc { color:rgba(255,255,255,0.92); }
.dim .desc { color:rgba(255,255,255,0.65); }
</style></head><body><div class="card">
  <div class="eyebrow">12 KOBLLUX Archetypes</div>
  <div class="archs">

    <div class="a" style="background:#f59e0b"><div class="label">NOVA</div><div class="desc">seed</div></div>
    <div class="a" style="background:#10b981"><div class="label">VITALIS</div><div class="desc">energy 528</div></div>
    <div class="a" style="background:#8b5cf6"><div class="label">PULSE</div><div class="desc">rhythm</div></div>
    <div class="a" style="background:#06b6d4"><div class="label">ARTEMIS</div><div class="desc">detect 672</div></div>
    <div class="a" style="background:#ec4899"><div class="label">SERENA</div><div class="desc">care 528</div></div>
    <div class="a" style="background:#ef4444"><div class="label">KAOS</div><div class="desc">rupture 777</div></div>
    <div class="a" style="background:#a855f7"><div class="label">GENUS</div><div class="desc">synth 852</div></div>
    <div class="a" style="background:#fbbf24"><div class="label">LUMINE</div><div class="desc">render 963</div></div>
    <div class="a dim" style="background:#64748b"><div class="label">SOLUS</div><div class="desc">silence</div></div>
    <div class="a" style="background:#34d399"><div class="label">RHEA</div><div class="desc">link 528</div></div>
    <div class="a dim" style="background:#818cf8"><div class="label">AION</div><div class="desc">time</div></div>
  </div>
</div></body></html>
