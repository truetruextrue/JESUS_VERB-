<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.veeb {
  display:inline-flex; align-items:center; gap:6px; flex-shrink:0;
  padding:3px 10px 3px 6px; border-radius:99px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(0,0,0,0.3);
}
.dot {
  width:11px; height:11px; border-radius:50%;
  animation:p 2s infinite;
}
@keyframes p { 0%,100%{opacity:.5;transform:scale(.9)} 50%{opacity:1;transform:scale(1.15)} }
.txt {
  font-size:10px; font-weight:700;
  font-family:var(--font-code); letter-spacing:.05em;
}
</style></head><body><div class="card" style="gap:12px">
  <div class="eyebrow">VEEB orb · live archetype tag</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <div class="veeb"><div class="dot" style="background:#3b82f6;box-shadow:0 0 8px #3b82f6"></div><span class="txt" style="color:#3b82f6">ATLAS · B</span></div>
    <div class="veeb"><div class="dot" style="background:#10b981;box-shadow:0 0 8px #10b981"></div><span class="txt" style="color:#10b981">VITALIS · E</span></div>
    <div class="veeb"><div class="dot" style="background:#8b5cf6;box-shadow:0 0 8px #8b5cf6"></div><span class="txt" style="color:#8b5cf6">PULSE · V</span></div>
    <div class="veeb"><div class="dot" style="background:#ec4899;box-shadow:0 0 8px #ec4899"></div><span class="txt" style="color:#ec4899">SERENA · V</span></div>
    <div class="veeb"><div class="dot" style="background:#fbbf24;box-shadow:0 0 8px #fbbf24"></div><span class="txt" style="color:#fbbf24">LUMINE · V</span></div>
    <div class="veeb"><div class="dot" style="background:#a855f7;box-shadow:0 0 8px #a855f7"></div><span class="txt" style="color:#a855f7">GENUS · E</span></div>
  </div>
</div></body></html>
