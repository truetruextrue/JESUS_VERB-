<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="flex-direction:row;align-items:center;justify-content:space-around;gap:18px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="width:130px;height:80px;border-radius:10px;background:rgba(15,23,42,0.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 40px rgba(0,0,0,0.3);position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#10b981)"></div>
    </div>
    <div style="font-family:var(--font-code);font-size:9px;color:#9aa4c8">glass · rainbow-top</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="width:130px;height:80px;border-radius:10px;background:rgba(139,92,246,0.14);border:1px solid #a855f7;box-shadow:0 0 14px rgba(139,92,246,0.4)"></div>
    <div style="font-family:var(--font-code);font-size:9px;color:#9aa4c8">selected · purple glow</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="width:130px;height:80px;border-radius:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.07);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)"></div>
    <div style="font-family:var(--font-code);font-size:9px;color:#9aa4c8">recessed · seed box</div>
  </div>
</div></body></html>
