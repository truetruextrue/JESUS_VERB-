<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="gap:12px">
  <div class="eyebrow">Dock · primary toolbar buttons</div>
  <div style="display:flex;gap:8px">
    <button style="flex:1;height:48px;border-radius:8px;border:1px solid #00f5ff;background:rgba(0,245,255,0.12);color:#00f5ff;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-ui)">▶<span>RUN</span></button>
    <button style="flex:1;height:48px;border-radius:8px;border:1px solid #10b981;background:rgba(16,185,129,0.12);color:#10b981;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-ui)">↑<span>PUSH</span></button>
    <button style="flex:1;height:48px;border-radius:8px;border:1px solid #a855f7;background:rgba(139,92,246,0.12);color:#a855f7;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-ui)">⚡<span>FUSE</span></button>
    <button style="flex:1;height:48px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#e4ecff;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-ui)">💾<span>SAVE</span></button>
    <button style="flex:1;height:48px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#e4ecff;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-ui)">📋<span>COPY</span></button>
  </div>
</div></body></html>
