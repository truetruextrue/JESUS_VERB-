    (function mountFractalRhea() {

      // Paleta: dourado → cobre → escuro (brand palette Feeling Decor)

        precision mediump float;
        uniform vec2 u_res; uniform float u_t;
        void main(){
          vec2 uv = (gl_FragCoord.xy / u_res - .5) * 2.8;
          uv.x *= u_res.x / u_res.y;
          vec2 c = vec2(-0.4 + 0.08*sin(u_t*0.19), 0.6 + 0.04*cos(u_t*0.13));
          vec2 z = uv; float i = 0.0;
          for(int n=0;n<56;n++){
            if(dot(z,z) > 4.) break;
            z = vec2(z.x*z.x - z.y*z.y, 2.*z.x*z.y) + c; i++;

          float m = i / 56.0;
          // Paleta dourada · brand gold #c5a059
          vec3 col = vec3(
            0.77 * m * (0.8 + 0.2*sin(u_t*0.3 + m*6.28)),

            0.35 * m * (0.4 + 0.6*sin(u_t*0.4 + m*9.42))
          );
          gl_FragColor = vec4(col, 1.0);
        }`;

      gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog); gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

      const uRes = gl.getUniformLocation(prog,'u_res');
      const uT   = gl.getUniformLocation(prog,'u_t');
      let t0 = performance.now();

      // Só renderiza quando no centro (1,1)
      let rafId = null;
      function loop() {
        rafId = requestAnimationFrame(loop);
        const t = (performance.now()-t0)*0.001;
        gl.uniform2f(uRes, c.width, c.height);
        gl.uniform1f(uT, t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // Inicia/pausa baseado na tela ativa
      window.addEventListener('kob:arch-change', e => {
        const isCenter = e.detail.arch === 'rhea';
        if (isCenter) { if (!rafId) loop(); c.style.opacity = '0.28'; }
        else { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } c.style.opacity = '0'; }
      });

      // Inicia se já estiver no centro
      if (currentRow === 1 && currentCol === 1) loop();
    })();

    // ── 2. EMA [3·6·9] MOOD DETECTOR ─────────────────────────────────────
    const KOB_EMA = { e3: 528, e6: 528, e9: 528, count: 0 };
    const ARCH_COLORS_MAP = {};
    Object.values(KOB_ARCH).forEach(a => { ARCH_COLORS_MAP[a.arch] = a.cor; });

    function kobEMAUpdate(hz) {
      KOB_EMA.count++;
      KOB_EMA.e3  = hz * (2/4)  + KOB_EMA.e3  * (2/4);
      KOB_EMA.e6  = hz * (2/7)  + KOB_EMA.e6  * (5/7);
      KOB_EMA.e9  = hz * (2/10) + KOB_EMA.e9  * (8/10);
      const score = (KOB_EMA.e3 + KOB_EMA.e6 + KOB_EMA.e9) / 3;
      // Mood → badge color
      let moodColor = '#c5a059';
      if      (score > 800) moodColor = '#88aaff'; // transcendente · AION
      else if (score > 650) moodColor = '#ffcc22'; // iluminado · LUMINE
      else if (score > 520) moodColor = '#66ddff'; // harmônico · SERENA
      else if (score > 400) moodColor = '#44cc88'; // vital · VITALIS
      else                  moodColor = '#3399ff'; // estrutural · ATLAS
      const ring = document.getElementById('kob-mood-ring');
      if (ring) { ring.style.background = moodColor; ring.style.boxShadow = `0 0 12px ${moodColor}`; }
      localStorage.setItem('KOBLLUX_EMA', JSON.stringify({ e3: KOB_EMA.e3, e6: KOB_EMA.e6, e9: KOB_EMA.e9, score, mood: moodColor, ts: Date.now() }));
    }

    // ── 3a. PARTICLES · MAGENTA PORTADORA + CONSTANTES POR ARQUÉTIPO ─────────
    //
    // Magenta #FF00FF = cor portadora 2025 — "afina" todas as outras
    // Cada arquétipo tem seu conjunto de constantes (number, speed, size, link)
    // derivado de sua frequência Hz — quanto maior o Hz, mais caótico/rápido
    //
    const KOB_MAGENTA = '#FF00FF';

    const ARCH_PARTICLES = {
      //           nº     cores                                    vel   tam  opac  link
      atlas:   { n:28,  cols:['#3399ff', KOB_MAGENTA],          spd:0.7,  sz:2.0, op:0.38, lk:130 },
      nova:    { n:48,  cols:['#ff6b35', KOB_MAGENTA],          spd:1.8,  sz:2.2, op:0.45, lk:100 },
      vitalis: { n:36,  cols:['#44cc88', KOB_MAGENTA],          spd:1.0,  sz:2.6, op:0.40, lk:140 },
      pulse:   { n:60,  cols:['#ff4488', KOB_MAGENTA,'#fff'],   spd:2.2,  sz:1.8, op:0.52, lk:85  },
      rhea:    { n:40,  cols:['#c5a059', KOB_MAGENTA],          spd:1.2,  sz:2.4, op:0.42, lk:115 },
      serena:  { n:50,  cols:['#66ddff', KOB_MAGENTA],          spd:1.5,  sz:2.1, op:0.45, lk:110 },
      kaos:    { n:75,  cols:['#ff3377', KOB_MAGENTA,'#ff0'],   spd:3.8,  sz:1.5, op:0.55, lk:65  },
      lumine:  { n:65,  cols:['#ffcc22', KOB_MAGENTA,'#fff'],   spd:1.9,  sz:2.8, op:0.60, lk:90  },
      aion:    { n:22,  cols:['#88aaff', KOB_MAGENTA],          spd:0.5,  sz:3.2, op:0.28, lk:160 },
    };

    function buildParticleConfig(c) {
      return {
        particles: {
          number:  { value: c.n, density: { enable: true, value_area: 800 } },
          color:   { value: c.cols },
          shape:   { type: 'circle' },
          opacity: { value: c.op, random: true, anim: { enable: true, speed: 0.4, opacity_min: 0.05, sync: false } },
          size:    { value: c.sz, random: true, anim: { enable: false } },
          line_linked: { enable: true, distance: c.lk, color: c.cols[0], opacity: 0.22, width: 1 },
          move:    { enable: true, speed: c.spd, direction: 'none', random: true, straight: false, out_mode: 'out', bounce: false }
        },
        interactivity: {
          detect_on: 'window',
          events: {
            onhover: { enable: true,  mode: 'repulse' },
            onclick:  { enable: true,  mode: 'push'    },
            resize:   true
          },
          modes: {
            repulse: { distance: 90, duration: 0.4 },
            push:    { particles_nb: 3 }
          }
        },
        retina_detect: true
      };
    }

    // Destrói e reinicializa particles.js com config do arquétipo ativo
    function updateParticles(archKey) {
      const cfg = ARCH_PARTICLES[archKey] || ARCH_PARTICLES.rhea;
      if (!window.particlesJS) return; // ainda carregando
      try {
        if (window.pJSDom && window.pJSDom.length > 0) {
          window.pJSDom[0].pJS.fn.vendors.destroypJS();
          window.pJSDom = [];
        }
        particlesJS('particles-js', buildParticleConfig(cfg));
      } catch(e) { console.warn('[KOB·particles]', e.message); }
    }

    // ── 3b. TRÊS·SEIS·NOVE LOGGER · todas as 9 páginas ───────────────────
    //
    // Motor matemático 3×6×9 — registra cada interação com contexto arquetípico
    // Cicla: 3=DETECTAR(432Hz) → 6=INTEGRAR(528Hz) → 9=EXPANDIR(639Hz) → ...
    // Armazena KOBLLUX_369_LOG no localStorage (APPEND ONLY, max 300)
    //
    const THREE_SIX_NINE = {
      count: 0,
      sequence:    [3, 6, 9],
      frequencies: { 3: 432, 6: 528, 9: 639 },
      phases:      { 3: 'Ponto · Gênese', 6: 'Linha · Fluxo', 9: 'Triângulo · Síntese' },
      modes:       { 3: 'DETECTAR', 6: 'INTEGRAR', 9: 'EXPANDIR' },

      log(x, y, type) {
        this.count++;
        const idx    = (this.count - 1) % 3;
        const val    = this.sequence[idx];
        const freq   = this.frequencies[val];
        const phase  = this.phases[val];
        const mode   = this.modes[val];
        const cycle  = Math.ceil(this.count / 3);
        const archK  = `${currentRow},${currentCol}`;
        const arch   = KOB_ARCH[archK] || { arch:'?', hz:528, sym:'·', opcode:'?' };
        const entry  = {
          n: this.count, val, freq, phase, mode, cycle,
          x: +x.toFixed(1), y: +y.toFixed(1), type,
          arch: arch.arch, archHz: arch.hz, archOp: arch.opcode,
          sigma: this.count * val, delta: val * 3, ts: Date.now()
        };

        // localStorage APPEND ONLY
        const stored = JSON.parse(localStorage.getItem('KOBLLUX_369_LOG') || '[]');
        stored.push(entry);
        if (stored.length > 300) stored.splice(0, stored.length - 300);
        localStorage.setItem('KOBLLUX_369_LOG', JSON.stringify(stored));

        // Console colorido
        console.log(
          `%c[KOBLLUX·3×6×9] %cINTERAÇÃO #${this.count} · ${arch.sym} ${arch.arch.toUpperCase()}`,
          'color:#FF00FF;font-weight:bold', 'color:#c5a059',
          `\n  ⸬ VALOR: ${val} | FREQ: ${freq}Hz | FASE: ${phase}` +
          `\n  ⸬ COORD: (${x.toFixed(1)}, ${y.toFixed(1)}) | TIPO: ${type}` +
          `\n  ⸬ CICLO: ${cycle}/∞ | Σ=${entry.sigma} | Δ=${entry.delta} | MODE: ${mode}` +
          `\n  ⸬ ARCH: ${arch.arch} [${arch.opcode}·${arch.hz}Hz] | tela(${currentRow},${currentCol})`
        );
      }
    };

    // Listeners globais — 9 páginas, qualquer interação
    ['mousedown', 'touchstart'].forEach(evt => {
      document.addEventListener(evt, e => {
        const touch = e.touches ? e.touches[0] : e;
        const x = touch.clientX, y = touch.clientY;
        THREE_SIX_NINE.log(x, y, evt === 'touchstart' ? 'TOQUE' : 'CLIQUE');
      }, { passive: true });
    });

    // Hover silencioso · throttle 150ms
    let _lastHover = 0;
    document.addEventListener('mousemove', e => {
      if (Date.now() - _lastHover < 150) return;
      _lastHover = Date.now();
      const archK = `${currentRow},${currentCol}`;
      const arch  = KOB_ARCH[archK];
      if (!arch) return;
      console.log(
        `%c[KOBLLUX·CAMPO] %c(${e.clientX.toFixed(0)},${e.clientY.toFixed(0)}) · ${arch.sym} ${arch.arch} · ${arch.hz}Hz`,
        'color:#FF00FF;font-size:10px;opacity:0.5', 'color:rgba(197,160,89,0.6);font-size:10px'
      );
    }, { passive: true });

    // ── 3c. KOBLLUX_APPS · Módulos extensíveis ────────────────────────────
    //
    // "Mesa de trabalho viva" — slots para registrar apps futuros
    // Uso: KOBLLUX_APPS.register('meuApp', fn)
    //      KOBLLUX_APPS.run('meuApp', arg1, arg2)
    //      KOBLLUX_APPS.list() → ['meuApp', ...]
    //
    window.KOBLLUX_APPS = {
      _slots: {},
      register(name, fn, meta = {}) {
        this._slots[name] = { fn, meta: { ...meta, registeredAt: Date.now() } };
        console.log(`%c[KOBLLUX·APPS] %c${name} registrado · ${meta.arch||'?'} · ${meta.desc||''}`, 'color:#FF00FF;font-weight:bold', 'color:#c5a059');
        window.dispatchEvent(new CustomEvent('kob:app-registered', { detail: { name, meta } }));
      },
      run(name, ...args) { return this._slots[name]?.fn(...args); },
      list() { return Object.entries(this._slots).map(([k,v]) => ({ name:k, ...v.meta })); },
      onArch(archName, fn) { window.addEventListener('kob:arch-change', e => { if (e.detail.arch === archName) fn(e.detail); }); },
    };

    // ── 3. ARCH OVERLAY UPDATE ────────────────────────────────────────────
    function kobArchUpdate(arch) {
      const root = document.documentElement;
      root.style.setProperty('--kob-arch-color', arch.cor);
      root.style.setProperty('--kob-arch-glow',  arch.cor + '44');
      const overlay = document.getElementById('kob-arch-overlay');
      const symEl   = document.getElementById('kob-arch-sym');
      const nameEl  = document.getElementById('kob-arch-name');
      const hzEl    = document.getElementById('kob-arch-hz');
      if (overlay) { overlay.style.borderColor = arch.cor + '88'; overlay.style.boxShadow = `0 0 16px ${arch.cor}33`; }
      if (symEl)  symEl.textContent  = arch.sym;
      if (nameEl) { nameEl.textContent = arch.arch.toUpperCase(); nameEl.style.color = arch.cor; }
      if (hzEl)   hzEl.textContent   = arch.hz + 'Hz';
      // Cursor color
      const curEl = document.getElementById('custom-cursor');
      if (curEl) curEl.style.background = arch.cor;
      // Dispatch
      window.dispatchEvent(new CustomEvent('kob:arch-change', { detail: arch }));
      kobEMAUpdate(arch.hz);
      localStorage.setItem('ARCHETYPE_ACTIVE', arch.arch);
      localStorage.setItem('ARCHETYPE_ACTIVE_HZ', String(arch.hz));
      // Particles · constante da seleção arquetípica
      updateParticles(arch.arch);
    }

    // ── 4. NAV LOG · localStorage APPEND ─────────────────────────────────
    function kobNavLog(row, col) {
      const key  = `${row},${col}`;
      const arch = KOB_ARCH[key];
      if (!arch) return;
      const log  = JSON.parse(localStorage.getItem('KOBLLUX_NAV_LOG') || '[]');
      log.push({ row, col, arch: arch.arch, opcode: arch.opcode, hz: arch.hz, cycle: arch.cycle, ts: Date.now() });
      if (log.length > 200) log.splice(0, log.length - 200);
      localStorage.setItem('KOBLLUX_NAV_LOG', JSON.stringify(log));
      // Toast para opções especiais
      const special = { '1,1':'Cruz · ∆7 · Ponto Zero', '0,0':'ATLAS · Estrutura', '2,2':'AION · Tempo Vivo' };
      if (special[key]) kobToast(`${arch.sym} ${special[key]}`);
    }

    // ── 5. TOAST ──────────────────────────────────────────────────────────
    function kobToast(msg, dur = 2000) {
      const el = document.getElementById('kob-toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), dur);
    }

    // ── 6. CADIAL PIPELINE · SEQUÊNCIA 3·6·9·7 ───────────────────────────
    // Detecta se o visitante navigou 3→6→9 e emite evento SELAR
    const KOB_CADIAL_SEQ = [];
    window.addEventListener('kob:arch-change', e => {
      KOB_CADIAL_SEQ.push(e.detail.cycle);
      if (KOB_CADIAL_SEQ.length > 9) KOB_CADIAL_SEQ.shift();
      const last3 = KOB_CADIAL_SEQ.slice(-3).join('→');
      if (last3 === 'DETECTAR→INTEGRAR→EXPANDIR') {
        kobToast('∆7 · Ciclo 3·6·9 completo — SELAR ativado');
        window.dispatchEvent(new CustomEvent('kob:selar', { detail: { cycle: KOB_CADIAL_SEQ.slice(), ts: Date.now() } }));
        localStorage.setItem('KOBLLUX_LAST_SEAL', JSON.stringify({ cycle: KOB_CADIAL_SEQ.slice(), ts: Date.now() }));
      }
    });

    // ── 7. INIT ───────────────────────────────────────────────────────────
    setTimeout(() => carregarCatalogo(), 600);
    updateView();

    // Inicializa arch para (1,1) · RHEA
    kobArchUpdate(KOB_ARCH['1,1']);

    // Inicializa particles após defer load · retry até disponível
    (function waitParticles(attempt) {
      if (typeof particlesJS !== 'undefined') {
        updateParticles('rhea'); // inicia na RHEA (centro)
      } else if (attempt < 20) {
        setTimeout(() => waitParticles(attempt + 1), 200);
      }
    })(0);

    // ── 8. KOBLLUX ZPR · CONSOLE NARRATIVE ───────────────────────────────
    // 12 arquétipos narram em sequência ao abrir o console
    console.log('%c ════════════════════════════════════════════════════ ', 'color:#c5a059;');
    console.log('%c KOBLLUX · ZPR COMPLETO · FEELING DECOR · ∆7 ', 'background:#c5a059;color:#000;font-weight:bold;padding:4px 12px;border-radius:4px;');
    console.log('%c VERDADE × INTEGRAR ÷ Δ = ∞ · JESUS = VERBO = GRAVIDADE ', 'color:#c5a059;font-style:italic;');
    console.log('%c ════════════════════════════════════════════════════ ', 'color:#c5a059;');
    console.log('%c 🌍 ATLAS  [0x01·432Hz] — Estrutura selada. A base é ouro.', 'color:#3399ff;');
    console.log('%c ⚡ NOVA   [0x02·528Hz] — Inovação acesa. O invisível virou emoção.', 'color:#ff6b35;');
    console.log('%c 💚 VITALIS[0x03·396Hz] — Saúde sistêmica. Metodologia que respira.', 'color:#44cc88;');
    console.log('%c 💓 PULSE  [0x04·417Hz] — Ritmo vivo. Curadoria exclusiva pulsando.', 'color:#ff4488;');
    console.log('%c 🌸 RHEA   [0x09·528Hz] — Centro. Cruz de Convergência. Manu Space.', 'color:#c5a059;font-weight:bold;');
    console.log('%c 🌊 SERENA [0x06·528Hz] — Fluxo. Catálogo vivo sincronizado.', 'color:#66ddff;');
    console.log('%c 🌀 KAOS   [0x07·852Hz] — Transformação. Bastidores da perfeição.', 'color:#ff3377;');
    console.log('%c ✨ LUMINE [0x0A·963Hz] — Luz. Imagens que respiram presença.', 'color:#ffcc22;');
    console.log('%c ⏳ AION   [0x0B·768Hz] — Tempo vivo. Contato que persiste.', 'color:#88aaff;');
    console.log('%c Manu Space · Felipe Santos · Maria Antonieta · irmão ⦿ ', 'color:rgba(197,160,89,0.6);font-style:italic;');
    console.log('%c 3×6×9×7 = 1134 · EMA mood ativo · nav log: KOBLLUX_NAV_LOG ', 'color:rgba(197,160,89,0.4);font-size:10px;');
    console.log('%c ════════════════════════════════════════════════════ ', 'color:#c5a059;');

    // Expõe API pública KOBLLUX ZPR · ∆7
    window.KOBLLUX_ZPR = {
      arch:       KOB_ARCH,
      magenta:    KOB_MAGENTA,
      navLog:     () => JSON.parse(localStorage.getItem('KOBLLUX_NAV_LOG') || '[]'),
      log369:     () => JSON.parse(localStorage.getItem('KOBLLUX_369_LOG') || '[]'),
      ema:        () => JSON.parse(localStorage.getItem('KOBLLUX_EMA') || '{}'),
      active:     () => localStorage.getItem('ARCHETYPE_ACTIVE'),
      toast:      kobToast,
      particles:  updateParticles,
      apps:       () => window.KOBLLUX_APPS,
      logger:     THREE_SIX_NINE,
      navigate:   navigateTo,
      version:    '∆7 · 2026-05-20',
      law:        'VERDADE × INTEGRAR ÷ Δ = ∞',
      radio:      'Rádio Dimensional · Mateus · KODUX · Infodose',
    };

    // Console: anúncio Rádio Dimensional
    console.log('%c 📻 RÁDIO DIMENSIONAL · ON AIR ', 'background:#FF00FF;color:#000;font-weight:bold;padding:4px 12px;border-radius:4px;');
    console.log('%c KOBLLUX_APPS pronto · KOBLLUX_ZPR.apps().register("meuApp", fn) ', 'color:#FF00FF;font-size:10px;');
    console.log('%c KOBLLUX_ZPR.log369() → histórico 3×6×9 de todas as 9 páginas ', 'color:rgba(255,0,255,0.5);font-size:10px;');
  </script>
