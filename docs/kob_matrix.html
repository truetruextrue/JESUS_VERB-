<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOBLLUX · MATRIX DENSA · ARQUITETURA VEEB</title>
  <!-- Fontes e pré-requisitos -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://kodux78k.github.io/oiDual--Y-/M0D/V-core/css/main-root.css">
  <link rel="stylesheet" href="https://kodux78k.github.io/oiDual--Y-/css/kob-dox-nanai-v4.css">

  <style>
    /* =====================================================================
       ARQUITETURA VEEB – SISTEMA DE INTERFACE VIVA (BASE COMPLETA)
       12 ARQUÉTIPOS APLICADOS AO HUD MAGNÉTICO
       ===================================================================== */

    /* ---------------------------------------------------------------------
       1. ATLAS – FUNDAÇÃO E VARIÁVEIS GLOBAIS
          O alicerce do sistema. Define o espaço, as forças primordiais
          e as constantes que governam todos os elementos.
       --------------------------------------------------------------------- */
    :root {
      /* Cores base – matéria‑prima do universo visual */
      --bg-dark: #02040a;
      --ink: #eaf6ff;
      --text: #f0f3f9;
      --muted: rgba(255, 255, 255, 0.45);

      /* Tipografia – a voz do sistema */
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;

      /* Campos magnéticos – limite de atracação (threshold) */
      --snap-threshold: 40px;

      /* Arquétipo VEEB – Kob (voz primária e secundária) – padrão */
      --kob-voice-primary: #00e28b;
      --kob-voice-secondary: #0EA5E9;

      /* Derivadas da voz – criadas com color-mix para consistência dinâmica */
      --kob-voice-bg-soft: color-mix(in srgb, var(--kob-voice-primary) 20%, transparent);
      --kob-voice-bg-strong: color-mix(in srgb, var(--kob-voice-primary) 40%, black);
      --kob-voice-glow: color-mix(in srgb, var(--kob-voice-primary) 60%, white);

      /* Painéis e superfícies – transparência controlada pela voz */
      --panel-bg: color-mix(in srgb, var(--kob-voice-primary) 10%, #0b0f18);

      /* Bordas – vivas, mas sutis */
      --border: color-mix(in srgb, var(--kob-voice-primary) 30%, rgba(255,255,255,0.1));

      /* Gradiente de fundo – céu noturno com aurora da voz */
      --bg-gradient:
        radial-gradient(
          circle at 50% -10%,
          color-mix(in srgb, var(--kob-voice-primary) 35%, #1a224f) 0%,
          #050714 60%,
          #000
        );

      /* Gradiente para textos e destaques */
      --grad-a: var(--kob-voice-primary);
      --grad-b: var(--kob-voice-secondary);

      /* Z‑index base */
      --z-base: 0;
      --z-content: 100;
      --z-widget: 500;
      --z-overlay: 1000;
      --z-system: 5000;

      /* Orb settings */
      --orb-speed: 7.8s;
      --kob-voice-accent: #ffffff;
    }

    /* Reset – limpeza do terreno */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--bg-dark) var(--bg-gradient);  /* Sobreposição do céu estrelado */
      color: var(--text);
      font-family: var(--font-main);
      overflow-x: auto;
      overflow-y: auto;  /* Ajustado para permitir rolagem do conteúdo */
      scroll-behavior: smooth;
    }

    /* ---------------------------------------------------------------------
       2. NOVA – O HUD FLUTUANTE (MOVIMENTO)
          O elemento que viaja pelo espaço da tela. Sua natureza é ser livre,
          mas responde a campos gravitacionais.
       --------------------------------------------------------------------- */
    .symbol-bar {
      position: fixed;
      left: 20px;
      top: auto;
      bottom: auto;
      right: auto;
      z-index: 9999;

      display: flex;
      gap: 10px;
      padding: 12px;
      align-items: center;
      justify-content: center;

      /* Estética – superfície vítrea */
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(15px) saturate(180%);
      -webkit-backdrop-filter: blur(15px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border-radius: 28px;

      /* Comportamento – arrasto nativo desabilitado */
      user-select: none;
      touch-action: none;

      /* Transições – base para o movimento elástico (Vitalis) */
      transition:
        opacity 0.6s ease,
        top 0.35s cubic-bezier(0.175,0.885,0.32,1.275),
        left 0.35s cubic-bezier(0.175,0.885,0.32,1.275),
        border-radius 0.25s ease,
        background 0.4s ease,
        border-color 0.5s ease;
    }

    /* ---------------------------------------------------------------------
       3. VITALIS – TRANSIÇÕES ELÁSTICAS E VIDA ORGÂNICA
          A curva cúbica que simula uma mola física. Faz o HUD parecer vivo.
       --------------------------------------------------------------------- */

    /* ---------------------------------------------------------------------
       4. PULSE – ESTADOS DE INTERAÇÃO E RESPOSTA IMEDIATA
          O HUD reage à presença do usuário: fica mais visível ao hover,
          opaco quando ocioso, e perde transições durante o arrasto.
       --------------------------------------------------------------------- */
    .symbol-bar.idle {
      opacity: 0.2;
    }
    .symbol-bar.idle:hover {
      opacity: 1;
    }

    .symbol-bar.is-dragging {
      opacity: 0.9;
      transition: none !important;
      transform: none !important;
      will-change: top, left;
    }

    /* ---------------------------------------------------------------------
       5. ARTEMIS – ESTADOS DE ENCAIXE (SNAP)
          Classes que transformam a aparência do HUD conforme a borda dominante.
       --------------------------------------------------------------------- */
    .symbol-bar.snap-side {
      flex-direction: column;
      border-radius: 0 24px 24px 0;
      border-left: 0;
    }

    .symbol-bar.snap-side-right {
      flex-direction: column;
      border-radius: 24px 0 0 24px;
      border-right: 0;
    }

    .symbol-bar.snap-top {
      flex-direction: row;
      border-radius: 0 0 24px 24px;
      border-top: 0;
    }

    .symbol-bar.snap-side,
    .symbol-bar.snap-side-right,
    .symbol-bar.snap-top {
      max-width: 90vw;
      max-height: 90vh;
    }

    .symbol-bar.floating {
      flex-direction: column;
      border-radius: 28px;
      inset: auto;
    }

    /* ---------------------------------------------------------------------
       6. SERENA – COLAPSO E ECONOMIA DE ESPAÇO
          O HUD pode se contrair a um pequeno núcleo, escondendo os símbolos.
       --------------------------------------------------------------------- */
    .symbol-bar.collapsed {
      min-width: 44px;
      min-height: 44px;
    }

    .symbol-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    }

    .symbol-bar.collapsed .symbol-wrap {
      width: 0;
      height: 0;
      margin: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0);
    }

    /* ---------------------------------------------------------------------
       7. KAOS – BOTÕES E AÇÕES TÁTEIS
          Elementos que o usuário toca, com feedbacks imediatos.
       --------------------------------------------------------------------- */
    .symbol-button {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 18px;

      cursor: pointer;
      flex-shrink: 0;
      position: relative;

      transition: all 0.2s ease;
    }

    .symbol-button:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--kob-voice-primary);
      color: var(--kob-voice-primary);
    }

    .symbol-button:active {
      transform: scale(0.9);
    }

    .symbol-button.main-toggle {
      background: linear-gradient(135deg,#1a1d29,#05070a);
      color: var(--kob-voice-primary);
      border-color: var(--kob-voice-primary);
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* ---------------------------------------------------------------------
       8. LUMINE – INDICADORES LUMINOSOS E FEEDBACK VISUAL
          Pequenos pontos de luz que mostram estado ativo, como a voz falando.
       --------------------------------------------------------------------- */
    .voice-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--kob-voice-primary);
      border: 2px solid #000;
      box-shadow: 0 0 5px var(--kob-voice-primary);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    .hud-info {
      font-size: 10px;
      color: var(--kob-voice-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;

      display: flex;
      align-items: center;
      padding: 0 10px;
      border-left: 1px solid var(--border);
      pointer-events: none;
    }

    .symbol-bar.snap-top .hud-info {
      display: none;
    }

    /* ---------------------------------------------------------------------
       9. SOLUS – FOCO NO TEXTO E LEITURA (TTS)
          O elemento que “fala” é destacado por um outline vivo.
       --------------------------------------------------------------------- */
    #kob-tts-outline {
      position: absolute;
      z-index: 9998;
      pointer-events: none;

      border: 2px solid var(--kob-voice-primary);
      border-radius: 8px;
      background: var(--kob-voice-bg-soft);
      box-shadow: 0 0 15px var(--kob-voice-primary);

      transition: all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
      display: none;
    }

    [data-tts-current="true"] {
      background: var(--kob-voice-bg-soft);
      border-radius: 8px;
      border-color: var(--kob-voice-primary) !important;
      box-shadow:
        0 0 15px var(--kob-voice-bg-soft),
        inset 0 0 10px var(--kob-voice-bg-soft);
      transform: scale(1.02);
      transition: all 0.3s ease;
    }

    /* ---------------------------------------------------------------------
       10. RHEA – ESTRUTURA DE PAINÉIS E CONTEÚDO
          Os blocos que organizam a informação de forma adaptável.
       --------------------------------------------------------------------- */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .system-title {
      font-weight: 800;
      font-size: 1.2rem;
      background: -webkit-linear-gradient(0deg, var(--grad-a), var(--grad-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    #clock {
      font-family: monospace;
      font-size: 1.1rem;
      color: var(--kob-voice-primary);
      transition: color 0.5s ease;
    }

    .content-box {
      max-width: 278px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* ---------------------------------------------------------------------
       11. GENUS – ACORDEÕES MODULARES
          Componentes expansíveis que se adaptam ao conteúdo.
       --------------------------------------------------------------------- */
    .accordion {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .accordion-header {
      padding: 15px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      user-select: none;
    }

    .accordion-header:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .accordion-content {
      max-height: 0;
      padding: 0 20px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .accordion.open .accordion-content {
      max-height: 2500px;
      padding: 15px 20px;
      opacity: 1;
      border-top: 1px solid var(--border);
    }

    .indicator {
      transition: transform 0.3s ease;
    }

    .accordion.open .indicator {
      transform: rotate(180deg);
    }

    /* ---------------------------------------------------------------------
       12. AION – CAMPOS DE ENTRADA E INTERAÇÕES FINAS
          Elementos que recebem dados do usuário, com feedback da voz.
       --------------------------------------------------------------------- */
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-family: var(--font-main);
      margin-bottom: 15px;
      margin-top: 5px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--kob-voice-primary);
    }

    /* ---------------------------------------------------------------------
       ÁREA DE TEXTO PARA LEITURA TTS (exemplo)
       --------------------------------------------------------------------- */
    #reader-content p {
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    #reader-content p strong {
      color: var(--kob-voice-primary);
      transition: color 0.5s ease;
    }

    /* ---------------------------------------------------------------------
       CORES DOS ARQUÉTIPOS (definidas via atributo body, mas também como classes para uso nos cards)
       --------------------------------------------------------------------- */
    /* Definições via body – permanecem para o HUD */
    body[data-voice-arch="kobllux"] { --kob-voice-primary: #22D3EE; --kob-voice-secondary: #0E7C9E; }
    body[data-voice-arch="kodux"]   { --kob-voice-primary: #F97316; --kob-voice-secondary: #C2410C; }
    body[data-voice-arch="atlas"]   { --kob-voice-primary: #38BDF8; --kob-voice-secondary: #1E3A8A; }
    body[data-voice-arch="nova"]    { --kob-voice-primary: #F72585; --kob-voice-secondary: #7209B7; }
    body[data-voice-arch="vitalis"] { --kob-voice-primary: #22C55E; --kob-voice-secondary: #166534; }
    body[data-voice-arch="pulse"]   { --kob-voice-primary: #EC4899; --kob-voice-secondary: #831843; }
    body[data-voice-arch="artemis"] { --kob-voice-primary: #A855F7; --kob-voice-secondary: #5B21B6; }
    body[data-voice-arch="serena"]  { --kob-voice-primary: #38BDF8; --kob-voice-secondary: #1E3A8A; }
    body[data-voice-arch="kaos"]    { --kob-voice-primary: #FACC15; --kob-voice-secondary: #B45309; }
    body[data-voice-arch="genus"]   { --kob-voice-primary: #E5E7EB; --kob-voice-secondary: #4B5563; }
    body[data-voice-arch="lumine"]  { --kob-voice-primary: #FDE047; --kob-voice-secondary: #CA8A04; }
    body[data-voice-arch="solus"]   { --kob-voice-primary: #0EA5E9; --kob-voice-secondary: #0369A1; }
    body[data-voice-arch="rhea"]    { --kob-voice-primary: #22C55E; --kob-voice-secondary: #166534; }
    body[data-voice-arch="aion"]    { --kob-voice-primary: #4F46E5; --kob-voice-secondary: #3730A3; }
    body[data-voice-arch="uno"]     { --kob-voice-primary: #F97316; --kob-voice-secondary: #C2410C; }
    body[data-voice-arch="dual"]    { --kob-voice-primary: #06B6D4; --kob-voice-secondary: #0E7C9E; }
    body[data-voice-arch="trinity"] { --kob-voice-primary: #EC4899; --kob-voice-secondary: #831843; }
    body[data-voice-arch="infodose"]{ --kob-voice-primary: #22C55E; --kob-voice-secondary: #166534; }
    body[data-voice-arch="horus"]   { --kob-voice-primary: #F59E0B; --kob-voice-secondary: #B45309; }

    /* Classes para uso nos cards – extraídas das definições acima */
    .arch-atlas { --arch-color: #38BDF8; --arch-secondary: #1E3A8A; }
    .arch-nova { --arch-color: #F72585; --arch-secondary: #7209B7; }
    .arch-vitalis { --arch-color: #22C55E; --arch-secondary: #166534; }
    .arch-pulse { --arch-color: #EC4899; --arch-secondary: #831843; }
    .arch-artemis { --arch-color: #A855F7; --arch-secondary: #5B21B6; }
    .arch-serena { --arch-color: #38BDF8; --arch-secondary: #1E3A8A; }
    .arch-kaos { --arch-color: #FACC15; --arch-secondary: #B45309; }
    .arch-genus { --arch-color: #E5E7EB; --arch-secondary: #4B5563; }
    .arch-lumine { --arch-color: #FDE047; --arch-secondary: #CA8A04; }
    .arch-solus { --arch-color: #0EA5E9; --arch-secondary: #0369A1; }
    .arch-rhea { --arch-color: #22C55E; --arch-secondary: #166534; }
    .arch-aion { --arch-color: #4F46E5; --arch-secondary: #3730A3; }

    /* =====================================================================
       ESTILOS ADICIONAIS PARA A PÁGINA KOBLLUX (HERO, MANIFESTO, PORTAL, CARDS)
       ===================================================================== */
    .hero, .manifesto, .portal-section, .archetypes-section, .law-footer {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .hero-sigil {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      color: var(--kob-voice-primary);
      opacity: 0.7;
      letter-spacing: 0.3em;
      margin-bottom: 2rem;
      white-space: pre;
      line-height: 1.6;
      animation: pulse-soft 4s ease-in-out infinite;
    }

    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.2rem, 6vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 40%, var(--kob-voice-primary) 70%, var(--grad-a) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s ease-in-out infinite;
      letter-spacing: 0.1em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .hero-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
      color: var(--kob-voice-secondary);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .hero-law {
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 300;
      color: var(--ink);
      max-width: 700px;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .hero-law strong {
      color: var(--kob-voice-primary);
      font-weight: 600;
    }

    .hero-seal {
      font-size: 2rem;
      letter-spacing: 0.3em;
      animation: pulseX 20s linear infinite;
      display: inline-block;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5em;
      color: var(--kob-voice-secondary);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 700;
      color: var(--kob-voice-primary);
      letter-spacing: 0.05em;
    }

    /* Manifesto Grid */
    .manifesto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .manifest-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .manifest-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--kob-voice-primary), transparent);
      opacity: 0.6;
    }

    .manifest-card-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--kob-voice-secondary);
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .manifest-card-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
      color: var(--kob-voice-primary);
      opacity: 0.3;
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      line-height: 1;
    }

    .manifest-card p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink);
      font-weight: 300;
    }

    /* Tabela de Portais */
    .portal-section {
      background: linear-gradient(180deg, transparent, rgba(10,10,32,0.8), transparent);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .portal-table-wrapper {
      max-width: 900px;
      margin: 2rem auto 0;
      overflow-x: auto;
    }

    .portal-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', monospace;
    }

    .portal-table th {
      font-family: var(--font-main);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--kob-voice-secondary);
      padding: 1rem 1.5rem;
      text-align: left;
      border-bottom: 1px solid color-mix(in srgb, var(--kob-voice-secondary) 20%, transparent);
      opacity: 0.7;
    }

    .portal-table td {
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 0.88rem;
      color: var(--ink);
    }

    .portal-table tr:hover td {
      background: rgba(255,255,255,0.02);
    }

    .portal-ascii {
      font-size: 1.1rem;
      color: var(--kob-voice-primary);
      white-space: nowrap;
    }

    .portal-name {
      color: var(--kob-voice-secondary);
      font-weight: bold;
      letter-spacing: 0.2em;
    }

    .portal-func {
      color: var(--ink);
      font-family: var(--font-main);
      font-size: 0.9rem;
    }

    /* Grid de Arquétipos (cards) */
    .archetypes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));

      background: linear-gradient(90deg, transparent, var(--card-accent), transparent);
    }

    .arch-symbol {
      font-size: 2.8rem;
      line-height: 1;

    .arch-header-text {

    .arch-number {

    .arch-body {

    .arch-visual-label {

    .arch-code-wrapper {
      display: flex;

      background: rgba(0,0,0,0.3);

      padding: 0.5rem 1rem;

    /* Acessibilidade */
    button:focus-visible {

    /* Scroll customizado */
    ::-webkit-scrollbar { width: 6px; }

    /* Responsividade */
    @media (max-width: 600px) {
      .hero, .manifesto, .portal-section, .archetypes-section, .law-footer {
        padding: 2rem 1rem;
      }
      .archetypes-grid {
        grid-template-columns: 1fr;
      }

    /* ── FRAME BROWSER ── */
    .wrap { position:relative; width:100%; min-height:100vh; }
    .content { position:fixed; inset:0; z-index:0; }
    #frame { width:100%; height:100%; border:none; display:block; background:#fff; }

    /* ── KOB-SYMMBAR SCROLL (CARROSSEL) ── */
    .kob-symmbar-scroll {
      display:flex; flex-direction:column; gap:10px;

    .kob-symmbar-scroll .symbol-wrap,

    /* ── Speechify · click-to-read ── */

  </style>
</head>

<style>

  #kblx-back{display:none;position:fixed;inset:0;z-index:9999;background:rgba(2,4,10,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;}

  #kblx-panel{background:rgba(5,5,22,.96);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(110,68,173,.45);border-radius:18px;padding:1.6rem 1.6rem 1.2rem;width:min(400px,92vw);box-shadow:0 0 60px rgba(107,68,173,.2),0 20px 50px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.04);animation:kblx-in .25s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes kblx-in{from{opacity:0;transform:translateY(-18px) scale(.96);}to{opacity:1;transform:none;}}
  #kblx-panel .p-chip{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:rgba(30,228,255,.65);letter-spacing:.4em;text-transform:uppercase;margin-bottom:.3rem;}
  #kblx-panel .p-title{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:800;color:#6B44AD;letter-spacing:.06em;margin-bottom:1rem;}

  #kblx-inp{width:100%;background:rgba(0,0,0,.45);border:1px solid rgba(110,68,173,.35);border-radius:8px;padding:.6rem .88rem;color:#e8e0f0;font-family:'JetBrains Mono',monospace;font-size:.82rem;outline:none;margin-bottom:.9rem;transition:border-color .2s,box-shadow .2s;}
  #kblx-inp:focus{border-color:#6B44AD;box-shadow:0 0 12px rgba(107,68,173,.3);}
  .kblx-row{display:flex;gap:.5rem;flex-wrap:wrap;}
  .kblx-btn{flex:1;min-width:72px;padding:.46rem .6rem;border-radius:8px;border:1px solid;font-family:'JetBrains Mono',monospace;font-size:.61rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:transparent;transition:all .18s;white-space:nowrap;}

<div id="kblx-back">

    <div class="kblx-row">
      <button class="kblx-btn kblx-save"  id="kblx-btn-save">⊙ Salvar no botão</button>

    </div>
  </div>

<script>
(function(){
  const LP   = 3000;          // ms para long-press
  const DASH = 119.38;        // 2π × 19 (r=19)

  let _activeBtn = null;
  let _timer     = null;
  let _raf       = null;
  let _t0        = null;

  const back  = document.getElementById('kblx-back');
  const panel = document.getElementById('kblx-panel');
  const ttl   = document.getElementById('kblx-ttl');
  const inp   = document.getElementById('kblx-inp');

  /* ── injeta anel em cada botão nav ── */
  document.querySelectorAll('.symbol-wrap button[data-url]').forEach(btn => {
    btn.style.position = 'relative';
    const d = document.createElement('div');
    d.className = 'kblx-ring';
    d.innerHTML = '<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/></svg>';
    btn.appendChild(d);
  });

  function ring(btn, pct){
    const c = btn.querySelector('.kblx-ring circle');
    if(!c) return;
    c.style.transition = 'none';
    c.style.strokeDashoffset = DASH * (1 - Math.min(pct,1));
  }
  function ringReset(btn){
    if(!btn) return;
    const c = btn.querySelector('.kblx-ring circle');
    if(!c) return;
    c.style.transition = 'stroke-dashoffset .2s ease';
    c.style.strokeDashoffset = DASH;
  }

  function openPanel(btn){
    _activeBtn = btn;
    const sym = (btn.textContent.trim().replace(/[\s\S]*?([\S])[\s\S]*/,'$1') || btn.dataset.id || '?');
    ttl.textContent = 'Botão  ' + sym + '  [data-id="' + (btn.dataset.id||'') + '"]';
    inp.value = btn.dataset.url || '';
    back.classList.add('open');
    setTimeout(()=>inp.focus(), 80);
  }

  function saveUrl(){
    if(!_activeBtn) return;
    const v = inp.value.trim();
    if(v) {
      _activeBtn.dataset.url = v;   /* ← único efeito: reescreve data-url no DOM */
      const hud = document.getElementById('hudStatus');
      if(hud){ const p=hud.textContent; hud.textContent='✓ data-url atualizado'; setTimeout(()=>hud.textContent=p, 2500); }
    }
    closePanel();
  }

  function closePanel(){
    back.classList.remove('open');
    _activeBtn = null;
  }

  document.getElementById('kblx-btn-save').addEventListener('click', saveUrl);
  document.getElementById('kblx-btn-close').addEventListener('click', closePanel);
  back.addEventListener('click', e=>{ if(e.target===back) closePanel(); });
  document.addEventListener('keydown', e=>{
    if(!back.classList.contains('open')) return;
    if(e.key==='Escape') closePanel();
    if(e.key==='Enter')  saveUrl();
  });

  /* ── long-press em cada botão nav ── */
  document.querySelectorAll('.symbol-wrap button[data-url]').forEach(btn => {

    function onDown(e){
      /* NÃO chama e.preventDefault() — deixa o sistema externo funcionar normalmente */
      _t0 = Date.now();

      _timer = setTimeout(()=>{
        /* 3s atingido → abre editor */
        cancelAnimationFrame(_raf);
        ringReset(btn);
        _t0 = null;
        openPanel(btn);
      }, LP);

      (function tick(){
        if(_t0===null) return;
        ring(btn, (Date.now()-_t0)/LP);
        _raf = requestAnimationFrame(tick);
      })();
    }

    function onUp(){
      /* apenas limpa anel — NÃO interfere em cliques curtos */
      clearTimeout(_timer);
      cancelAnimationFrame(_raf);
      ringReset(btn);
      _t0 = null;
    }

    btn.addEventListener('pointerdown',   onDown, {passive:true}); /* passive:true → não bloqueia */
    btn.addEventListener('pointerup',     onUp,   {passive:true});
    btn.addEventListener('pointerleave',  onUp,   {passive:true});
    btn.addEventListener('pointercancel', onUp,   {passive:true});
  });

})();
</script>

  // ===== RENDERIZAR CARDS =====
  const grid = document.getElementById('archetypes-grid');
  archetypes.forEach(a => {

        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // ===== ACORDION (para todos os cards) =====
  function initAccordion() {
    document.querySelectorAll('.arch-card, .manifest-card').forEach(card => {
      const header = card.querySelector('.arch-card-header') || card.querySelector('.manifest-card-key');
      const body = card.querySelector('.arch-body') || card.querySelector('.collapsible-body');
      if (!header || !body) return;

      // Adiciona indicador se não existir
      if (!header.querySelector('.indicator')) {
        const ind = document.createElement('span');
        ind.className = 'indicator';
        ind.setAttribute('aria-hidden', 'true');
        ind.textContent = '▾';
        header.appendChild(ind);
      }

      header.setAttribute('tabindex', '0');
      header.setAttribute('role', 'button');
      header.setAttribute('aria-expanded', 'false');
      card.classList.add('is-collapsed');
      card.classList.remove('is-open');

      // Armazena padding original
      const computed = window.getComputedStyle(body);
      body.dataset.padTop = parseFloat(computed.paddingTop) || 0;
      body.dataset.padBottom = parseFloat(computed.paddingBottom) || 0;

      const toggle = () => {
        if (card.classList.contains('is-collapsed')) {
          // Abrir
          body.style.height = 'auto';
          const full = body.scrollHeight;
          body.style.height = '0px';
          requestAnimationFrame(() => {
            body.style.paddingTop = body.dataset.padTop + 'px';
            body.style.paddingBottom = body.dataset.padBottom + 'px';
            body.style.height = full + 'px';
            body.style.opacity = '1';
          });
          card.classList.remove('is-collapsed');
          card.classList.add('is-open');
          header.setAttribute('aria-expanded', 'true');
        } else {
          // Fechar
          const full = body.scrollHeight;
          body.style.height = full + 'px';
          requestAnimationFrame(() => {
            body.style.height = '0px';
            body.style.paddingTop = '0px';
            body.style.paddingBottom = '0px';
            body.style.opacity = '0';
          });
          card.classList.add('is-collapsed');
          card.classList.remove('is-open');
          header.setAttribute('aria-expanded', 'false');
        }
      };

      header.addEventListener('click', (e) => {
        e.preventDefault();
        toggle();
      });
      header.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle();
        }
      });

      body.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'height' && card.classList.contains('is-open')) {
          body.style.height = 'auto';
        }
      });
    });
  }

  // ===== Inicialização =====
  initAccordion();

  // Observar novos cards (se houver)
  const observer = new MutationObserver(muts => {
    muts.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.nodeType === 1) {
          if (node.matches('.arch-card, .manifest-card')) initAccordion();
          node.querySelectorAll && node.querySelectorAll('.arch-card, .manifest-card').forEach(initAccordion);
        }
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();

// ── KOBLLUX · NAVEGADOR SIMBIÓTICO + TTS POR ARQUÉTIPO ──
(function() {
  const frame = document.getElementById('frame');
  const hud   = document.getElementById('hudStatus');

  // Clicar num botão data-url carrega a URL no frame
  document.querySelectorAll('.symbol-wrap button[data-url]').forEach(btn => {
    btn.addEventListener('click', function() {
      const url = this.dataset.url;
      if (!url) return;
      frame.src = url;
      if (hud) hud.textContent = (this.dataset.id || '…').toUpperCase() + ' · ▶';
      frame.addEventListener('load', function onLoad() {
        frame.removeEventListener('load', onLoad);
        try { if (hud) hud.textContent = frame.contentDocument.title || 'KOBLLUX · ORB NEXUS'; } catch(e) {}
      });
    });
  });

  // btn-prev = voltar no histórico do frame
  document.getElementById('btn-prev')?.addEventListener('click', () => {
    try { frame.contentWindow.history.back(); } catch(e) {}
  });

  // btn-next = avançar no histórico do frame
  document.getElementById('btn-next')?.addEventListener('click', () => {
    try { frame.contentWindow.history.forward(); } catch(e) {}
  });

  // btn-play = ler seleção com a voz do arquétipo ativo
  function _hudStatus(msg, revert) {
    if (hud) {
      const prev = hud.textContent;
      hud.textContent = msg;
      if (revert) setTimeout(() => { if (hud.textContent === msg) hud.textContent = prev; }, revert);
    }
  }
  function _speak(text) {
    if (!window.speechSynthesis || !text) return;
    const id = document.body.getAttribute('data-voice-arch') || 'kobllux';
    const onstart = () => _hudStatus('▶ ' + text.slice(0,20) + (text.length>20?'…':''));
    const onend   = () => _hudStatus('KOBLLUX · ORB NEXUS');
    if (window.KOBLLUX_VOICES) {
      KOBLLUX_VOICES.speak(text, id, { onstart, onend, onerror: onend });
    } else {
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'pt-BR';
      const ptV = speechSynthesis.getVoices().find(v => v.lang.startsWith('pt'));
      if (ptV) utt.voice = ptV;
      utt.onstart = onstart; utt.onend = utt.onerror = onend;
      speechSynthesis.speak(utt);
    }
  }
  document.getElementById('btn-play')?.addEventListener('click', () => {
    if (!window.speechSynthesis) return;
    let text = '';
    try { text = frame.contentWindow.getSelection().toString().trim(); } catch(e) {}
    if (!text) text = window.getSelection().toString().trim();
    if (!text) {
      try {
        text = Array.from(frame.contentDocument.querySelectorAll('p,h1,h2,h3'))
          .slice(0, 4).map(el => el.innerText).join(' ').trim().slice(0, 400);
      } catch(e) {}
    }
    if (!text) { _hudStatus('selecione texto…', 2000); return; }
    _speak(text);
  });

  // btn-pause = pausar / retomar
  document.getElementById('btn-pause')?.addEventListener('click', () => {
    if (!window.speechSynthesis) return;
    if (speechSynthesis.paused) {
      speechSynthesis.resume();
      _hudStatus('▶ retomando…');
    } else {
      speechSynthesis.pause();
      _hudStatus('⏸ pausado');
    }
  });

  // btn-stop = parar
  document.getElementById('btn-stop')?.addEventListener('click', () => {
    if (window.speechSynthesis) speechSynthesis.cancel();
    _hudStatus('KOBLLUX · ORB NEXUS');
  });

  // btn-arch = ciclar arquétipo + feedback de voz
  const IDS = ['kobllux','atlas','nova','vitalis','pulse','artemis','serena','kaos','genus','lumine','solus','rhea','aion'];
  document.getElementById('btn-arch')?.addEventListener('click', () => {
    const cur  = document.body.getAttribute('data-voice-arch') || 'kobllux';
    const next = IDS[(IDS.indexOf(cur) + 1) % IDS.length];
    document.body.setAttribute('data-voice-arch', next);
    localStorage.setItem('kob_current_arch', next);
    _hudStatus(next.toUpperCase() + ' ▶', 2000);
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance('Arquétipo ' + next);
      u.lang = 'pt-BR'; speechSynthesis.speak(u);
    }
  });

  // Restaurar arquétipo salvo
  const saved = localStorage.getItem('kob_current_arch');
  if (saved && IDS.includes(saved)) document.body.setAttribute('data-voice-arch', saved);
})();

</script>


<!-- SPEECHIFY · Click-to-Read · Word Highlight -->
<script>
(function(){
  const READABLE_SEL = ['h1','h2','h3','.hero-title','.hero-law','.manifesto p',
    '.arch-name','.arch-role','.arch-body p','p'].join(',');
  let _el = null, _origHTML = '';

  function _restore(el) {
    if (!el) return;
    el.innerHTML = _origHTML;
    el.classList.remove('spf-reading');
    _el = null; _origHTML = '';
  }

  function _speak(el) {
    if (!window.speechSynthesis) return;
    if (_el && _el !== el) _restore(_el);
    _el = el; _origHTML = el.innerHTML;
    const plain = (el.innerText || el.textContent || '').trim();
    if (!plain) return;

    const words = plain.split(/\s+/);
    let html = '';
    words.forEach((w, i) => { html += `<span class="spf-word" id="_spf${i}">${w}</span> `; });
    el.innerHTML = html;
    el.classList.add('spf-reading');

    const archId = document.body.getAttribute('data-voice-arch') || 'kobllux';
    const hud = document.getElementById('hudStatus');
    const prevHud = hud ? hud.textContent : '';

    const utt = new SpeechSynthesisUtterance(plain);
    utt.lang = 'pt-BR';
    if (window.KOBLLUX_VOICES) {
      try {
        const cfg = KOBLLUX_VOICES.getConfig ? KOBLLUX_VOICES.getConfig(archId) : {};
        utt.rate = cfg.r || 1; utt.pitch = cfg.p || 1;
        const v = KOBLLUX_VOICES.resolveVoice
          ? KOBLLUX_VOICES.resolveVoice(speechSynthesis.getVoices(), archId, 'pt-BR') : null;
        if (v) utt.voice = v;
      } catch(e) {}
    }

    let wi = 0;
    utt.onboundary = e => {
      if (e.name !== 'word') return;
      document.querySelectorAll('.spf-active').forEach(s => s.classList.remove('spf-active'));
      const span = document.getElementById('_spf' + wi++);
      if (span) { span.classList.add('spf-active'); span.scrollIntoView({behavior:'smooth',block:'nearest'}); }
    };
    utt.onend = utt.onerror = () => {
      setTimeout(() => _restore(el), 350);
      if (hud) hud.textContent = prevHud;
    };
    if (hud) hud.textContent = '▶ ' + plain.slice(0,20) + (plain.length>20?'…':'');
    speechSynthesis.cancel();
    speechSynthesis.speak(utt);
  }

  function _attach() {
    document.querySelectorAll(READABLE_SEL).forEach(el => {
      if (el.dataset.spf) return;
      if (el.closest('#symbolBar,#kblx-back,script,style')) return;
      el.dataset.spf = '1';
      el.classList.add('spf-readable');
      el.addEventListener('click', function(e) {
        if (window.getSelection().toString().trim()) return;
        e.stopPropagation();
        _speak(this);
      });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _attach);
  else _attach();

  window.NEBULA_SPF = { speak: _speak, restore: _restore };
})();
</script>
