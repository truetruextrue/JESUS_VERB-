<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>AZZIRA · Ordem Oculta</title>
<style>
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 30%,#141428,#07070a 75%);color:#f2f0ea;font-family:monospace;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;user-select:none}
h1{font-size:5vmin;letter-spacing:.25em;color:#f0c060;margin:8px 0 0;text-shadow:0 0 24px #f0c06066}
p{margin:0;color:#8a8a95;font-size:2.6vmin;letter-spacing:.12em;text-align:center}
#board{display:grid;grid-template-columns:repeat(8,min(10.5vw,56px));grid-template-rows:repeat(8,min(10.5vw,56px));gap:2px;border:2px solid #f0c06055;border-radius:8px;box-shadow:0 0 40px #f0c06033}
.c{display:grid;place-items:center;cursor:pointer;font-size:min(3.4vw,17px);line-height:1;transition:filter .12s;position:relative}
.cl{background:#1d2b45}.cd{background:#0a0f1c}
.c small{position:absolute;bottom:2px;right:4px;font-size:min(2vw,9px);opacity:.5;color:#c9a84c}
.c:hover{filter:brightness(1.6)}
.c.on{filter:brightness(2.2);box-shadow:inset 0 0 0 2px #f0c060}
#st{font-size:3vmin;color:#f0c060;min-height:4vmin;text-align:center}
button{background:#0f1426;border:1px solid #f0c066;border-radius:10px;color:#f0c060;padding:8px 16px;font:700 3vmin monospace;cursor:pointer;letter-spacing:.1em}
</style></head><body>
<h1 style="color:#ba82db;text-shadow:0 0 24px #ba82db66">◈ AZZIRA</h1>
<p>"No silêncio fluido da forma perfeita, tua essência desperta." · ordem oculta · cristal · geometria</p>
<div id="board"></div><div id="st">toque numa casa para soar</div>
<button onclick="window._melodia()">[ TOCAR TRIBO 3-6-9-7 ]</button>
<script>
var FILES=['A','B','C','D','E','F','G','H'];
var BASE=[0,2,4,5,7,9,11,12];       /* A=C4 B=D4 C=E4 D=F4 E=G4 F=A4 G=B4 H=C5 */
var NOME=['DÓ','RÉ','MI','FÁ','SOL','LÁ','SI'];
var PECAS=['T','C','B','D','R','B','C','T'];
function midi(f,r){return 60+BASE[f]+(r-1)*12;}
function nome(f,r){var s=(BASE[f]+(r-1)*12)%12;return NOME[s]?(NOME[s]+(r+4)):'·';}
var AC=null;
function beep(m){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=440*Math.pow(2,(m-69)/12);o.type='sine';g.gain.setValueAtTime(.22,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+((m%7===0)?.9:.5));o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+1);}catch(e){}}
var bd=document.getElementById('board'),st=document.getElementById('st');
var cells=[];
for(var r=8;r>=1;r--)for(var f=0;f<8;f++){
 (function(f,r){var d=document.createElement('div');d.className='c '+(((f+r)%2)?'cl':'cd');
  if(r===1)d.innerHTML='<b style="color:#f0c060">'+PECAS[f]+'</b>';else if(r===2)d.innerHTML='<span style="opacity:.85">●</span>';
  d.innerHTML+='<small>'+FILES[f]+r+'</small>';
  d.title=nome(f,r)+' · '+midi(f,r);
  d.onclick=function(){beep(midi(f,r));st.textContent=FILES[f]+r+' = '+nome(f,r)+' ('+midi(f,r)+' midi · '+(440*Math.pow(2,(midi(f,r)-69)/12)).toFixed(1)+'Hz)';d.classList.add('on');setTimeout(function(){d.classList.remove('on');},300);};
  bd.appendChild(d);cells.push({f:f,r:r,d:d});})(f,r);
}
window._melodia=function(){
 var seq=[0,4,2,6,3,7,5,1];st.textContent='tribo 3-6-9-7 soando…';
 seq.forEach(function(f,i){setTimeout(function(){var c=cells.filter(function(x){return x.f===f&&x.r===1;})[0];if(c){c.d.click();}},i*260);});
};
</script></body></html>
